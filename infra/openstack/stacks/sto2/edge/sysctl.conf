# Forwarding is on in the kernel, and nothing is forwarded: the forward chain of the firewall drops
# by default and holds no rule. It stays on for the redirect settings below: with forwarding on, the
# kernel takes an ICMP redirect on an interface only when conf/all and the interface's own setting
# both accept it, and all does not; with forwarding off either one would do, and the interface,
# which exists before these settings are applied, keeps the kernel's default, which accepts them
# (ip-sysctl, accept_redirects).
net.ipv4.ip_forward = 1
# Equal-cost paths to a Service address are chosen by hashing the flow's layer 4 fields (addresses,
# ports and protocol), so every packet of a connection takes the one path.
net.ipv4.fib_multipath_hash_policy = 1
# The edge sends its own packets to the workers and to the cloud's router on one subnet, and neither
# tells nor takes a redirect.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
