# Forwarding is on in the kernel; the forward chain of the firewall decides what is forwarded.
net.ipv4.ip_forward = 1
# Equal-cost paths to a Service address are chosen by hashing the flow's layer 4 fields (addresses,
# ports and protocol), so every packet of a connection takes the one path.
net.ipv4.fib_multipath_hash_policy = 1
# The edge forwards a packet back out of the interface it came in on, between hosts of one subnet,
# and must not tell the router that sent it to take another way.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
