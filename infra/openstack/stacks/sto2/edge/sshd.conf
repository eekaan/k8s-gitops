# The SSH daemon's settings on an edge, installed by the first boot as
# /etc/ssh/sshd_config.d/00-edge.conf. The edge states its daemon's key exchange, ciphers, MACs and
# authentication itself, so none of them is what an image's own configuration holds. The main
# configuration includes that directory ahead of its own lines, files in lexical order, and sshd
# takes the first value it reads for a keyword (sshd_config(5): Include, and "the first obtained
# value will be used"), so the name 00- puts these ahead of the image's drop-ins and its own
# settings. A Match block read later still changes them for the connections it matches, which this
# file cannot prevent: scripts/edge-check compares each setting with what `sshd -T` reports for the
# edge's user's connection.

# Only the post-quantum hybrid key exchanges, which OpenSSH 9.9 added by these names and 10.0 made
# its default (mlkem768x25519-sha256 first), and curve25519-sha256, which an older client has.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,curve25519-sha256

# Authenticated encryption (AEAD) ciphers only, each in OpenSSH's default list. They need no MAC,
# and the MACs the daemon offers all the same are encrypt-then-MAC ones from that list, so it offers
# nothing the tree does not state.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# A public key and nothing else, for an ordinary user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey

# An edge is a public host that forwards for nobody over SSH.
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
