# The SSH daemon's settings on an edge, installed by the first boot as
# /etc/ssh/sshd_config.d/00-edge.conf. The main configuration includes that directory ahead of its
# own lines, files in lexical order, and sshd takes the first value it reads for a keyword
# (sshd_config(5): Include, and "the first obtained value will be used"), so the name 00- puts these
# ahead of the image's drop-ins and its own settings. scripts/edge-check reads this file and compares
# each setting with what `sshd -T` reports on the edge.

# Only the post-quantum hybrid key exchanges, which OpenSSH 9.9 added by these names and 10.0 made its
# default (mlkem768x25519-sha256 first), and curve25519-sha256, which an older client still has.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,curve25519-sha256

# A public key and nothing else, for an ordinary user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey

# An edge is a public host that forwards for nobody over SSH.
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
