# A drop-in for the image package's haproxy.service, installed by the first boot as
# /etc/systemd/system/haproxy.service.d/10-edge.conf. The package's unit starts the proxy as root,
# which drops to a user once its sockets are bound, and keeps a PID file and a control socket under
# /run; this runs it as its own user from the start, with the one capability that binding the public
# ports (80 and 443) takes, and nothing writable, so it has neither of those files.
[Service]
User=haproxy
Group=haproxy
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=true
# The package binds /dev/log into a chroot; the configuration logs to standard output, and has none.
BindReadOnlyPaths=
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true
# Enough descriptors for the configuration's connection limit, each connection holding two.
LimitNOFILE=16384
# The package's command line with no PID file and no master socket, which an unprivileged user could
# not make under /run.
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg
ExecReload=
ExecReload=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -c -q
ExecReload=/bin/kill -USR2 $MAINPID
