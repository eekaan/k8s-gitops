---
# Every source a chart, the cluster's artifact or the tools image comes from, and how it is signed.
# scripts/signatures-check (just signatures-check, offline) holds the rows and what Flux builds to
# each other, and just signatures-verify asks the registries, anonymously, whether each pin of the
# tree is signed as its row says; docs/kubernetes.md, Signatures, says what each requires, and its
# table is these rows.
#
# The sources are the url of every OCIRepository and HelmRepository Flux builds, the artifact the
# FluxInstance syncs and the tools image scripts/tools-image publishes; a GitRepository holds no
# chart and has no row. One row per source, the objects of one url sharing it, and no row a source
# does not use: the synced artifact first, then the tools image, then every other source sorted by
# source, byte by byte. A row has exactly the fields of its kind, each one line of text (a reason
# may fold over lines):
#   source    the url as the source object writes it, oci://... or https://...
#   signed    keyless: signed keyless, by one identity:
#               issuer   the OIDC issuer, as a pattern: ^, a literal with every dot escaped, $
#               subject  the identity, as a pattern: ^, a literal with every dot escaped up to and
#                        including the @ that begins its ref, the ref, which alone may hold a
#                        bracket expression, a quantifier or a group with an alternation, and $,
#                        the only $; no bare dot, backslash class, lazy quantifier or flag group
#               from     the publisher's page that states the identity, or the tag whose
#                        signature's certificate it was read from
#             key: signed with a key:
#               key      the path of the PEM public key under signatures/
#               digest   sha512 where the publisher signs over SHA-512; SHA-256 when left out
#               from     the publisher's page that gives the key, or where it was read
#             unsigned: no signature where Flux looks for one:
#               reason   why: what the publisher's page says about signing, or that it says nothing
#   cluster   false, with a reason, on a keyless or key row: the source is verified before merge and
#             not by Flux, and the reason says what the pinned source-controller cannot do or why
#             nothing on the cluster pulls it. Every key row carries it, as no Secret of a key is
#             built for a verify block.
# Every OCIRepository whose row is keyless without cluster: false verifies exactly that issuer and
# subject (provider cosign, one matchOIDCIdentity, no secretRef), and so does the FluxInstance's
# patch of its sync source; no other source has a verify block.
sources:
  - source: oci://ghcr.io/eekaan/k8s-gitops/manifests
    signed: keyless
    issuer: '^https://token\.actions\.githubusercontent\.com$'
    subject: '^https://github\.com/eekaan/k8s-gitops/\.github/workflows/publish\.yaml@refs/heads/main$'
    from: docs/kubernetes.md, Publishing, the identity scripts/publish signs and verifies with
  - source: oci://ghcr.io/eekaan/k8s-gitops/ci-tools
    signed: keyless
    issuer: '^https://token\.actions\.githubusercontent\.com$'
    subject: '^https://github\.com/eekaan/k8s-gitops/\.github/workflows/tools-image\.yaml@refs/heads/main$'
    from: README.md, The tools image, the identity scripts/tools-image signs and pins with
    cluster: false
    reason: nothing on the cluster pulls it; the checks run in it, and just tools-image-pin
      verifies it before versions.yaml records it
  - source: https://charts.fairwinds.com/stable
    signed: unsigned
    reason: a chart from a Helm repository, unsigned by its kind, as Flux verifies no signature of
      a chart an https Helm repository serves
  - source: https://crowdsecurity.github.io/helm-charts
    signed: unsigned
    reason: a chart from a Helm repository, unsigned by its kind, as Flux verifies no signature of
