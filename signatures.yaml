  - source: https://open-policy-agent.github.io/gatekeeper/charts
    signed: unsigned
    reason: a chart from a Helm repository, unsigned by its kind, as Flux verifies no signature of
      a chart an https Helm repository serves
  - source: oci://docker.io/envoyproxy/gateway-helm
    signed: unsigned
    reason: Envoy Gateway signs its image keyless and not its chart
      (gateway.envoyproxy.io/docs/install/verify-images), and the chart has no signature
