# An ExternalName Service, whose cluster name is another name for any host, reached on the URL's
# port, and a Service without a selector, which leads where endpoints written by hand say.
apiVersion: v1
kind: Service
metadata:
  name: rev-external
  namespace: kube-system
spec:
  type: ExternalName
  externalName: node.example
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-name
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
