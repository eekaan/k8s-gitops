---
# Relabelings beside the tree's one, which run after the operator's own and so set what Prometheus
# scrapes and what the exporter probes: the address and the target by name, the target by a
# labelmap of the hostname label, and the target by a target label built from the groups of the
# regex, the second of which is none and expands to nothing.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: readdressed
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: probed.example
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
        - action: replace
          targetLabel: __address__
          replacement: node.example:9963
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: retargeted
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: probed.example
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
        - action: replace
          targetLabel: __param_target
          replacement: http://node.example:9963/
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: labelmapped
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: http://node.example:9963/
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
        - action: labelmap
          regex: hostname
          replacement: __param_target
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: templated
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: http://node.example:9963/
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
        - action: replace
          sourceLabels:
            - hostname
          regex: (.+)
          targetLabel: __param_${2}target
---
# Fields beyond the tree's shape: a scrape class, whose relabelings and settings apply to the
# scrape; a scheme and a proxy of the prober, the second of which Prometheus connects to instead;
# a label beside the hostname; Ingresses beside the static targets, and Ingresses alone; and a
# module of the exporter's that tests/probes.bats does not pin.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: scrape-class
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  scrapeClass: nodes
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: probed.example
      relabelingConfigs:
