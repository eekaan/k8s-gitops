---
# Probes that are not in the one shape the check accepts, each named after the way it leaves it,
# and each else as the tree's: the job, the module public_https, the blackbox exporter's Service as
# its prober, the public Gateway's proxies' Service as its one target, the hostname label and the
# one relabeling that makes it the parameter hostname. Prometheus scrapes a Probe's prober, and the
# exporter there connects to each of its targets, so each of these could reach a port that has no
# rule; the check does not follow where a name leads, so it refuses them all alike.
# The kubelet's Service, which the Prometheus Operator makes at run time, headless, with the nodes'
# addresses as its endpoints (pkg/kubelet/controller.go of the pinned operator): as the target, at
# the cilium-operator's metrics port, and as the prober, at the agents' health port.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kubelet-target
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://kube-prometheus-stack-kubelet.kube-system.svc.cluster.local:9963/metrics
      labels:
        hostname: probed.example
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kubelet-prober
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: kube-prometheus-stack-kubelet.kube-system.svc:9879
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: probed.example
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
---
# Headless Services of the render whose names resolve to the nodes' own addresses: Envoy's, over the
# host-network DaemonSet on every node, as the target at the cilium-operator's metrics port, and the
# scheduler's, over the control planes' static pods, which no render holds, as the prober at
# Envoy's metrics port.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: headless-host-network
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://cilium-envoy.kube-system.svc.cluster.local:9963/
      labels:
        hostname: probed.example
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
---
