---
# A prober that is not the exporter's Service, and targets that are not the proxies' Service on a
# port of the Gateway's listeners: an address and a port without a scheme, another port of the
# Service, the Service's name in another namespace, and a second target beside the Service.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: not-the-exporter
  namespace: monitoring
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: prober.example:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/
      labels:
        hostname: probed.example
      relabelingConfigs:
