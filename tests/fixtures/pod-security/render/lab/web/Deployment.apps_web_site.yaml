---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: web
spec:
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          image: registry.example.invalid/site-prepare:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: site
          image: registry.example.invalid/site:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
