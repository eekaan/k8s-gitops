---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: web
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nightly
              image: registry.example.invalid/site-nightly:1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
