---
apiVersion: batch/v1
kind: Job
metadata:
  name: site-migrate
  namespace: web
  annotations:
    helm.sh/hook: pre-upgrade
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.invalid/site-migrate:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
