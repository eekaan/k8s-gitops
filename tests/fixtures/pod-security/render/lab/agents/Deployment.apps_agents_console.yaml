---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: agents
spec:
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: registry.example.invalid/console:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
