---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: greeter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: greeter
  valuesFrom:
    - kind: ConfigMap
      name: greeter-values
  values:
    domain: greeter.${CLUSTER_DOMAIN}
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: _
                annotations:
                  fixture/post-rendered: "true"
