---
# Stands in for a Secret that sops decrypts: its values must never reach a render or a diff. Only
# stringData here, so the secrets scan has nothing to flag; the tests add data where they need it.
apiVersion: v1
kind: Secret
metadata:
  name: site-token
type: Opaque
stringData:
  token: fixture-site-token-value
sops:
  version: 3.13.3
