---
# Gizmo as the release v2.0.0 defines it: a colour is required beside the size, and the extra, the
# parts and the addresses are gone.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gizmos.example.invalid
spec:
  group: example.invalid
  names:
    kind: Gizmo
    listKind: GizmoList
    plural: gizmos
    singular: gizmo
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - size
                - colour
              properties:
                size:
                  type: integer
                name:
                  type: string
                colour:
                  type: string
