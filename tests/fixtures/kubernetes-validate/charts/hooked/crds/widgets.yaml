---
# The definition of Widget, which scripts/kubernetes-validate makes a schema of: under spec a size,
# required but defaulted, an image, a note that may be null and an extra that keeps unknown fields
# beside the one it types, and nothing else.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.invalid
spec:
  group: example.invalid
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - size
              properties:
                size:
                  type: integer
                  default: 1
                image:
                  type: string
                note:
                  type: string
                  nullable: true
                extra:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    known:
                      type: string
