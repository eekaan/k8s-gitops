---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: example.com/worker:1
