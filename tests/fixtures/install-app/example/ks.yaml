---
# An application whose HelmRelease names no release: tests/cluster-flux.bats installs it with
# install-app to check the release helm-controller would make of it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: example
  namespace: flux-system
spec:
  path: ./apps/base/example/example/app
  targetNamespace: example
  sourceRef:
    kind: ExternalArtifact
    name: example
