---
# Inputs of talos/talman.yaml.tftpl for a cluster of three control planes and three workers, in the
# shape the cluster stack renders them, with addresses from the documentation ranges. talman runs
# outside the node network and reaches each node at its floating address, which lies outside it,
# so a patch that takes the node's address from the wrong place shows in the rendered
# configuration. The Talos and Kubernetes versions come from the repository's versions.yaml.
cluster_name: example
# The API load balancer's address on the node network.
endpoint: https://192.0.2.10:6443
node_subnet: 192.0.2.0/25
# The load balancer's two addresses and the control planes' floating addresses.
api_sans:
  - 192.0.2.10
  - 192.0.2.210
  - 192.0.2.211
  - 192.0.2.212
  - 192.0.2.213
# The API load balancer's floating address, where the cluster recipes reach the Kubernetes API.
api_address: 192.0.2.210
# The cluster stack's default pod subnet, which holds a /24 for every node as the stack requires; no
# documentation range is large enough.
pod_subnet: 10.244.0.0/16
service_subnet: 203.0.113.0/24
# The operator allowlist: two networks, apart from every other range here.
operator_cidrs:
  - 198.51.100.0/26
  - 198.51.100.64/26
# The API load balancer's own addresses on the node network: its address, and the networks of the
# node network's DHCP pool, from which its ports take theirs. And the CI host's address there.
api_load_balancer_addresses:
  - 192.0.2.10/32
  - 192.0.2.96/28
ci_host_address: 192.0.2.6
# The plumbing stack's numbers for Services announced over BGP: the range LoadBalancer addresses come
# from, outside the node subnet, and the documentation AS numbers and two edge addresses on the node
# subnet.
service_range: 192.0.2.128/28
bgp:
  cluster_asn: 64496
  edge_asn: 64497
  edge_addresses:
    - 192.0.2.7
    - 192.0.2.8
  gateway_address: 192.0.2.133
# Each node at its floating address, and with its own address on the node network.
nodes:
  - hostname: cp-1
    role: controlplane
    address: 192.0.2.211
    floating_ip: 192.0.2.211
    private_address: 192.0.2.20
  - hostname: cp-2
    role: controlplane
    address: 192.0.2.212
    floating_ip: 192.0.2.212
    private_address: 192.0.2.21
  - hostname: cp-3
    role: controlplane
    address: 192.0.2.213
    floating_ip: 192.0.2.213
    private_address: 192.0.2.22
  - hostname: worker-1
    role: worker
    address: 192.0.2.221
    floating_ip: 192.0.2.221
    private_address: 192.0.2.30
  - hostname: worker-2
    role: worker
    address: 192.0.2.222
    floating_ip: 192.0.2.222
    private_address: 192.0.2.31
  - hostname: worker-3
    role: worker
    address: 192.0.2.223
    floating_ip: 192.0.2.223
    private_address: 192.0.2.32
