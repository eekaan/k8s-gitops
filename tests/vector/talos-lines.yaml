---
# Vector's unit tests of the log collector's configuration (kubernetes/apps/base/monitoring/vector),
# which `just vector-check` runs with `vector test` beside the rendered configuration, in the image
# the collector runs, with VECTOR_SELF_NODE_NAME set to node-1. Each input is a line of a format
# Talos v1.14 writes to /var/log/<service>.log, as the file source hands it on: the line in message,
# the file it came from in file, the pod's name in host and the time it was read in timestamp. The
# formats are the kernel's messages, the prefix Go's log package gives machined's, apid's and
# trustd's lines, etcd's JSON, containerd's and cri's logfmt and the kubelet's klog; udevd's lines
# have none. Each line stays whole, takes its own time and level where it has them, and gets the
# node's name and its service's, and the tests of the formats find it at the last transform before
# the store, so a line of each of these services is seen going on to it, as tests/logs.bats checks.
# The kernel's audit records and the node's audit log are dropped. The last tests start at the pods'
# transform with a record as the kubernetes_logs source hands it on with its default field names:
# the pod's labels and annotations in kubernetes.pod_labels and kubernetes.pod_annotations, its
# node's labels in kubernetes.node_labels, its namespace's in kubernetes.namespace_labels and
# kubernetes.namespace_annotations, and single fields beside them. The tests named in sentence case
# are scenarios of features/logs.feature, proved here; each starts at the first transform on its
# way to the store and watches the last, as tests/logs.bats checks, and the sources keep their
# default field names, as it also checks against the rendered configuration.
tests:
  - name: a kernel message keeps the kernel's time and priority
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:    warn: [2026-11-14T12:00:01.123456789Z]: drbd: module verification failed"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kernel")
              assert_eq!(.node, "node-1")
              assert_eq!(.facility, "kern")
              assert_eq!(.level, "warn")
              assert_eq!(.timestamp, t'2026-11-14T12:00:01.123456789Z')
              assert_eq!(.message, "kern:    warn: [2026-11-14T12:00:01.123456789Z]: drbd: module verification failed")
              assert!(!exists(.host))

  - name: a machined line keeps the time Go's log package wrote, also from the rotated file
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/machined.log.1"
          .host = "vector-x1y2z"
          .message = "2026/11/14 12:00:02.234567 [talos] task startAllServices (1/1): done"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "machined")
              assert_eq!(.node, "node-1")
              assert_eq!(.timestamp, t'2026-11-14T12:00:02.234567Z')
              assert!(!exists(.level))

  - name: an apid line keeps the time Go's log package wrote
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/apid.log"
          .host = "vector-x1y2z"
          .message = "2026/11/14 12:00:06.678901 service.go:35: starting apid with config: listen address :50000, skip client cert verify false, node routing disabled false, readonly role mode false"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "apid")
              assert_eq!(.node, "node-1")
              assert_eq!(.timestamp, t'2026-11-14T12:00:06.678901Z')

  - name: a trustd line keeps the time Go's log package wrote
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/trustd.log"
          .host = "vector-x1y2z"
          .message = "2026/11/14 12:00:07.789012 reg.go:83: removing client auth organization from CSR: [system:masters]"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "trustd")
              assert_eq!(.node, "node-1")
              assert_eq!(.timestamp, t'2026-11-14T12:00:07.789012Z')

  - name: an etcd line keeps the time and level of its JSON
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/etcd.log"
          .message = s'{"level":"warn","ts":"2026-11-14T12:00:03.345678Z","caller":"etcdserver/util.go:170","msg":"apply request took too long"}'
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "etcd")
              assert_eq!(.level, "warn")
              assert_eq!(.timestamp, t'2026-11-14T12:00:03.345678Z')

  - name: a containerd line keeps the time and level of its logfmt
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/containerd.log"
          .message = s'time="2026-11-14T12:00:04.456789012Z" level=error msg="failed to pull image"'
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "containerd")
              assert_eq!(.level, "error")
              assert_eq!(.timestamp, t'2026-11-14T12:00:04.456789012Z')

  - name: a cri line keeps the time and level of its logfmt
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/cri.log"
          .message = s'time="2026-11-14T12:00:08.890123456Z" level=info msg="Start subscribing containerd event"'
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "cri")
              assert_eq!(.level, "info")
              assert_eq!(.timestamp, t'2026-11-14T12:00:08.890123456Z')

  - name: a kubelet line keeps the time and level of its klog header
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kubelet.log"
          .message = s'E1114 12:00:05.567890    1234 pod_workers.go:1301] "Error syncing pod, skipping"'
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kubelet")
              assert_eq!(.level, "error")
              # klog writes no year.
              assert_eq!(format_timestamp!(.timestamp, "%m-%d %H:%M:%S%.6f"), "11-14 12:00:05.567890")

  # klog writes no year, and Vector takes the current one, the year the tests run in. Each of the
  # next two reads its line on 1 January, so a line from 31 December would be dated a year ahead.
  - name: a kubelet line from 31 December read on 1 January is dated in the year before
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kubelet.log"
          .message = s'I1231 23:59:58.123456    1234 kubelet.go:2511] "SyncLoop (housekeeping)"'
          .timestamp = parse_timestamp!(format_timestamp!(now(), "%Y") + "-01-01T00:00:05Z", "%+")
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              year = to_int!(format_timestamp!(now(), "%Y"))
              assert_eq!(.timestamp, parse_timestamp!(to_string(year - 1) + "-12-31T23:59:58.123456Z", "%+"))

  - name: a kubelet line dated ahead even in the year before keeps the time it was read
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kubelet.log"
          .message = s'I1231 23:59:58.123456    1234 kubelet.go:2511] "SyncLoop (housekeeping)"'
          .timestamp = parse_timestamp!(to_string(to_int!(format_timestamp!(now(), "%Y")) - 2) + "-01-01T00:00:05Z", "%+")
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              year = to_int!(format_timestamp!(now(), "%Y"))
              assert_eq!(.timestamp, parse_timestamp!(to_string(year - 2) + "-01-01T00:00:05Z", "%+"))

  - name: a line without a time of its own keeps the time it was read
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/udevd.log"
          .message = "Starting systemd-udevd version 257"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "udevd")
              assert_eq!(.message, "Starting systemd-udevd version 257")
              assert_eq!(.timestamp, t'2026-11-14T13:00:00Z')
              assert!(!exists(.level))

  # The audit record leaves at a filter transform, which Vector counts in
  # vector_component_discarded_events_total of its own metrics; of the two lines, only the other
  # one leaves the filter for the store.
  - name: Kernel audit records are dropped and counted
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:  notice: [2026-11-14T12:00:03.000000000Z]: audit: type=1400 audit(1794571203.000:42): apparmor=\"DENIED\" operation=\"open\""
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:    warn: [2026-11-14T12:00:04.000000000Z]: auditing is not mentioned here: drbd: module verification failed"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "kern:    warn: [2026-11-14T12:00:04.000000000Z]: auditing is not mentioned here: drbd: module verification failed")
              assert_eq!(.talos_service, "kernel")

  - name: a kernel line that is not an audit record goes on to the store
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:    warn: [2026-11-14T12:00:04.000000000Z]: auditing is not mentioned here: drbd: module verification failed"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kernel")
              assert_eq!(.level, "warn")

  # The kernel prints audit records with pr_notice, so a line at the same priority that is no audit
  # record must go on: the filter matches the audit prefix, not a priority.
  - name: a kernel line at the audit records' priority goes on to the store
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:  notice: [2026-11-14T12:00:05.000000000Z]: Console: switching to colour dummy device 80x25"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_auditd_log
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kernel")
              assert_eq!(.level, "notice")

  # One audit event as the kernel's audit subsystem writes it for a pod's process, which Talos's
  # policy runs as pod_t, that creates a file with openat in a directory on a filesystem without
  # SELinux labels, whose files Talos's policy gives unlabeled_t, while SELinux is permissive: an
  # AVC record with permissive=1 and the SYSCALL, CWD, PATH, PROCTITLE and EOE records that share
  # its msg=audit(<time>:<serial>) id, each a line of /var/log/auditd.log, as the file source hands
  # it on. No audit rule is loaded: the AVC record makes the kernel write the system call's records
  # when it returns, SYSCALL with key=(null), and PATH records only for the names it collected after
  # the AVC, an unnamed parent and the file to be created, which it records again once the file
  # exists; those two PATH records are left out here.
  - name: The audit log's records of a permissive denial do not reach the store, and are counted
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=AVC msg=audit(1794571200.123:4242): avc:  denied  { write } for  pid=3141 comm=\"store\" " +
            "name=\"2026-11-14\" dev=\"drbd1000\" ino=131073 scontext=system_u:system_r:pod_t:s0 " +
            "tcontext=system_u:object_r:unlabeled_t:s0 tclass=dir permissive=1"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=SYSCALL msg=audit(1794571200.123:4242): arch=c000003e syscall=257 success=yes exit=7 " +
            "a0=ffffff9c a1=c000a1b2c0 a2=241 a3=1a4 items=4 ppid=2718 pid=3141 auid=4294967295 uid=0 gid=0 " +
            "euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"store\" exe=\"/store\" " +
            "subj=system_u:system_r:pod_t:s0 key=(null)"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=CWD msg=audit(1794571200.123:4242): cwd=\"/\""
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=PATH msg=audit(1794571200.123:4242): item=0 name=(null) inode=131073 " +
            "dev=93:3e8 mode=040755 ouid=0 ogid=0 rdev=00:00 obj=system_u:object_r:unlabeled_t:s0 nametype=PARENT " +
            "cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=PATH msg=audit(1794571200.123:4242): item=1 name=(null) nametype=CREATE " +
            "cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=PROCTITLE msg=audit(1794571200.123:4242): proctitle=\"/store\""
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log.1"
          .host = "vector-x1y2z"
          .message = "type=EOE msg=audit(1794571200.123:4242): "
          .timestamp = t'2026-11-14T13:00:00Z'
    no_outputs_from:
      - drop_auditd_log

  # Vector counts a filter's discards under the filter's own component_id, so the audit log's lines
  # pass the kernel's filter and leave at drop_auditd_log, the series docs/kubernetes.md names.
  - name: the audit log's lines are counted as discards of drop_auditd_log
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "audit backlog limit reached, some audit events may have been lost"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      - extract_from: drop_audit
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "auditd")
              assert_eq!(.message, "audit backlog limit reached, some audit events may have been lost")
    no_outputs_from:
      - drop_auditd_log

  # Every line of the audit log is dropped, whatever its type and whether or not it is a record: an
  # ANOM_ABEND record, which the kernel writes without an audit rule for a process that dumps core,
  # and the line Talos's auditd writes when records were lost on their way to it among them. The
  # kernel's lines and another service's go on, each as it was.
  - name: No record of the audit log reaches the store, and a line of another service does
    inputs:
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=ANOM_ABEND msg=audit(1794571201.000:4243): auid=4294967295 uid=0 gid=0 ses=4294967295 " +
            "subj=system_u:system_r:pod_t:s0 pid=2718 comm=\"worker\" exe=\"/worker\" sig=11 res=1"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "type=CWD msg=audit(1794571201.000:4244): cwd=\"/\""
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/auditd.log"
          .host = "vector-x1y2z"
          .message = "audit backlog limit reached, some audit events may have been lost"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kernel.log"
          .host = "vector-x1y2z"
          .message = "kern:    warn: [2026-11-14T12:00:04.000000000Z]: drbd: module verification failed"
          .timestamp = t'2026-11-14T13:00:00Z'
      - insert_at: talos_files
        type: vrl
        source: |
          .file = "/var/log/kubelet.log"
          .host = "vector-x1y2z"
          .message = "type=AVC is only a word in this kubelet line"
          .timestamp = t'2026-11-14T13:00:00Z'
    outputs:
      # Vector passes a condition when any one event satisfies it, so each line has its own.
      - extract_from: drop_auditd_log
        expected_event_count: 2
        conditions:
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kernel")
              assert_eq!(.node, "node-1")
              assert_eq!(.message, "kern:    warn: [2026-11-14T12:00:04.000000000Z]: drbd: module verification failed")
          - type: vrl
            source: |
              assert_eq!(.talos_service, "kubelet")
              assert_eq!(.node, "node-1")
              assert_eq!(.message, "type=AVC is only a word in this kubelet line")

  - name: A pod's record carries the named labels and no field per other label
    inputs:
      - insert_at: pod_fields
        type: vrl
        source: |
          .message = "level=info msg=\"scrape\""
          .timestamp = t'2026-11-14T13:00:00Z'
          .kubernetes.pod_namespace = "monitoring"
          .kubernetes.pod_name = "vector-x1y2z"
          .kubernetes.container_name = "vector"
          .kubernetes.container_id = "containerd://4f1c2b7e9a0d"
          .kubernetes.container_image = "docker.io/timberio/vector:0.61.0-distroless-libc"
          .kubernetes.container_image_id = "docker.io/timberio/vector@sha256:1a3451978644d5cd4b99a0b28c990791e2f7e1efbea4184122f1c59a56448143"
          .kubernetes.pod_uid = "6b0e4c1a-2f3d-4e5f-8a9b-0c1d2e3f4a5b"
          .kubernetes.pod_ip = "192.0.2.21"
          .kubernetes.pod_ips = ["192.0.2.21"]
          .kubernetes.pod_owner = "DaemonSet/vector"
          .kubernetes.pod_node_name = "node-3"
          .kubernetes.pod_annotations = {
            "checksum/config": "9f2c4e",
            "kubectl.kubernetes.io/restartedAt": "2026-11-14T12:00:00Z",
            "prometheus.io/scrape": "true"
          }
          .kubernetes.namespace_labels = {
            "kubernetes.io/metadata.name": "monitoring",
            "kustomize.toolkit.fluxcd.io/name": "cluster-apps",
            "kustomize.toolkit.fluxcd.io/namespace": "flux-system",
            "pod-security.kubernetes.io/enforce": "privileged"
          }
          .kubernetes.namespace_annotations = {
            "kustomize.toolkit.fluxcd.io/prune": "disabled",
            "kustomize.toolkit.fluxcd.io/ssa": "IfNotPresent",
            "description": "metrics and logs"
          }
          .kubernetes.pod_labels = {
            "app.kubernetes.io/name": "vector",
            "app.kubernetes.io/instance": "vector",
            "app.kubernetes.io/component": "Agent",
            "app.kubernetes.io/managed-by": "Helm",
            "app.kubernetes.io/part-of": "logs",
            "app.kubernetes.io/version": "0.61.0-distroless-libc",
            "helm.sh/chart": "vector-0.50.0",
            "controller-revision-hash": "7d9f8c6b5",
            "pod-template-generation": "3"
          }
          .kubernetes.node_labels = {
            "beta.kubernetes.io/arch": "amd64",
            "beta.kubernetes.io/os": "linux",
            "kubernetes.io/arch": "amd64",
            "kubernetes.io/hostname": "node-3",
            "kubernetes.io/os": "linux",
            "node-role.kubernetes.io/control-plane": "",
            "node.kubernetes.io/exclude-from-external-load-balancers": "",
            "topology.kubernetes.io/region": "RegionOne",
            "topology.kubernetes.io/zone": "nova"
          }
    outputs:
      - extract_from: pod_fields
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kubernetes.pod_labels, {
                "app.kubernetes.io/name": "vector",
                "app.kubernetes.io/instance": "vector",
                "app.kubernetes.io/component": "Agent"
              })
              assert!(!exists(.kubernetes.node_labels))
              assert!(!exists(.kubernetes.pod_annotations))
              assert!(!exists(.kubernetes.namespace_labels))
              assert!(!exists(.kubernetes.namespace_annotations))
              assert_eq!(.node, "node-3")
              assert_eq!(.kubernetes.pod_namespace, "monitoring")
              assert_eq!(.kubernetes.pod_name, "vector-x1y2z")
              assert_eq!(.kubernetes.container_name, "vector")
              assert_eq!(.kubernetes.container_id, "containerd://4f1c2b7e9a0d")
              assert_eq!(.kubernetes.container_image, "docker.io/timberio/vector:0.61.0-distroless-libc")
              assert_eq!(.kubernetes.container_image_id, "docker.io/timberio/vector@sha256:1a3451978644d5cd4b99a0b28c990791e2f7e1efbea4184122f1c59a56448143")
              assert_eq!(.kubernetes.pod_uid, "6b0e4c1a-2f3d-4e5f-8a9b-0c1d2e3f4a5b")
              assert_eq!(.kubernetes.pod_ip, "192.0.2.21")
              assert_eq!(.kubernetes.pod_ips, ["192.0.2.21"])
              assert_eq!(.kubernetes.pod_owner, "DaemonSet/vector")
              assert_eq!(.kubernetes.pod_node_name, "node-3")
              assert_eq!(.timestamp, t'2026-11-14T13:00:00Z')
              assert_eq!(.message, "level=info msg=\"scrape\"")

  - name: a pod's record without the named labels carries no label field
    inputs:
      - insert_at: pod_fields
        type: vrl
        source: |
          .message = "hello"
          .timestamp = t'2026-11-14T13:00:00Z'
          .kubernetes.pod_namespace = "default"
          .kubernetes.pod_name = "plain"
          .kubernetes.pod_node_name = "node-1"
          .kubernetes.pod_labels = {"run": "plain"}
    outputs:
      - extract_from: pod_fields
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.kubernetes.pod_labels))
              assert_eq!(.node, "node-1")
