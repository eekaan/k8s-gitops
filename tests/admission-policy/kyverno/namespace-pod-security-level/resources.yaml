---
apiVersion: v1
kind: Namespace
metadata:
  name: pass-restricted
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: pass-baseline
  labels: {pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: pass-privileged
  labels: {pod-security.kubernetes.io/enforce: privileged}
---
apiVersion: v1
kind: Namespace
metadata:
  name: fail-no-labels
---
apiVersion: v1
kind: Namespace
metadata:
  name: fail-other-labels
  labels: {team: platform}
---
apiVersion: v1
kind: Namespace
metadata:
  name: fail-unknown-level
  labels: {pod-security.kubernetes.io/enforce: strict}
---
# A level that is only audited and warned about is not a level that is enforced.
apiVersion: v1
kind: Namespace
metadata:
  name: fail-audit-only
  labels: {pod-security.kubernetes.io/audit: restricted, pod-security.kubernetes.io/warn: restricted}
