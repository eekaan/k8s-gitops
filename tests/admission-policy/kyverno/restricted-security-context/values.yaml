---
# The labels of the namespaces the resources are in, which Kyverno's CLI cannot read from the
# resources and the rule's namespaceSelector needs.
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
namespaceSelector:
  - name: strict
    labels:
      pod-security.kubernetes.io/enforce: restricted
  - name: loose
    labels:
      pod-security.kubernetes.io/enforce: privileged
