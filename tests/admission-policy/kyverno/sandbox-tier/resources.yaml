---
# A namespace without the label is not the rule's to judge: each of these pods would fail its tier
# (tests/admission-policy.bats moves them into the tier's namespace to show it).
apiVersion: v1
kind: Pod
metadata: {name: skip-userns-unlabelled, namespace: unlabelled}
spec:
  hostUsers: true
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
