---
# Each pod has the context the restricted level requires, so what tells them apart is the isolation
# of the tier alone: hostUsers and runtimeClassName.
apiVersion: v1
kind: Pod
metadata: {name: pass-userns, namespace: sandbox-userns}
spec:
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: registry.example/app:1.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata: {name: pass-gvisor, namespace: sandbox-gvisor}
spec:
  runtimeClassName: gvisor
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: registry.example/app:1.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata: {name: pass-kata, namespace: sandbox-kata}
spec:
  runtimeClassName: kata
