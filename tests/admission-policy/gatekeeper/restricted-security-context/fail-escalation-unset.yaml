---
apiVersion: v1
kind: Pod
metadata: {name: fail-escalation-unset, namespace: strict}
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: registry.example/app:1.0
      securityContext:
        capabilities: {drop: [ALL]}
