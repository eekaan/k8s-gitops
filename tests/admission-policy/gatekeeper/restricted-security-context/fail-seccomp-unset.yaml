---
apiVersion: v1
kind: Pod
metadata: {name: fail-seccomp-unset, namespace: strict}
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.example/app:1.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
