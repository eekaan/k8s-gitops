---
# How each key of the secret store that an ExternalSecret of the tree reads is rotated.
# scripts/secret-rotate (just secret-rotate) reads this file before it reaches the cluster, and
# writes a new value only to a key whose entry says generated. tests/openbao.bats holds the file to
# the ExternalSecrets under kubernetes/: every key one of them reads has an entry, and no entry
# names a key that none reads. docs/kubernetes.md, Rotating an application's secret, says how a
# key of each rotation is rotated.
#
# An entry has:
#   path      the secret's path under secrets/, as just bao-put takes it
#   key       the key at that path. Left out, the entry is for every key at the path that no
#             other entry names; a dataFrom extract, which reads them all, needs such an entry
#   rotation  generated: any new random value will do, and just secret-rotate makes one;
#             re-encryption: data is encrypted under the value, and is lost unless it is encrypted
#             again under the new one;
#             issued: the value is made elsewhere, by a provider that issues it or by the owner
#             who writes it
#   reason    a sentence, for every rotation but generated: what a made-up value would break.
#             just secret-rotate gives it when it refuses the key
secrets:
  - path: demo/hello
    key: greeting
    rotation: generated
  - path: ai-system/n8n
    key: encryption-key
    rotation: re-encryption
    reason: n8n encrypts the credentials in its database under it and keeps a copy on its volume, and refuses to start with another key than that copy
  - path: ascender/ascender
    key: secret-key
    rotation: re-encryption
    reason: Ascender encrypts every credential and encrypted setting in its database under a key derived from it, and opens none of them under another value
  - path: cert-manager/cloudflare
    key: api-token
    rotation: issued
    reason: the DNS provider issues the token, scoped to the cluster's zone, and a value made here would authenticate to nothing
  - path: sso-system/dex
    rotation: issued
    reason: the path's keys are the GitHub OAuth App's client ID and secret, which GitHub issues, and dex could sign nobody in with others
  - path: sso-system/oauth2-proxy
    key: allowed-emails
    rotation: issued
    reason: it is the owner's list of who may sign in, which only the owner can write
  - path: volsync
    key: RESTIC_MASTER_PASSWORD
    rotation: re-encryption
    reason: every volume repository's password is derived from it, so a new master opens none of the backups made under the old one
  - path: volsync
    rotation: issued
    reason: the path's other keys are the cluster's S3 key, which the cloud issues, and just bao-seed-volsync --rotate-s3 writes a new one into the store
  - path: postgres-backups
    key: SSE_C_KEY
    rotation: re-encryption
    reason: every base backup and WAL segment of the cluster's databases is encrypted under it at the provider, which reads none of them under another key, so a new key needs a new destination path
  - path: monitoring/alert-destinations
    rotation: issued
    reason: the path's keys are the addresses Alertmanager sends notifications and the heartbeat to, which the services behind them issue, and a value made here would reach neither
