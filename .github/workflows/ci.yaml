---
# One job per group of checks the justfile defines, side by side, then the job named ci, the
# required check on main, which passes only when all of them passed. No job has a path filter, so
# every pull request gets its result.
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; each push to main keeps its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  groups:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.4
          install_args: just jq
      - id: groups
        run: just ci-groups

  check:
    needs: groups
    runs-on: ubuntu-latest
    strategy:
      # Every group reports its own result, whichever fails first.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The secrets scan reads every commit, not only the tip.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.4
          install_args: just http:dagger
      # The group's name reaches the shell as a variable, never as text spliced into the command.
      - run: just ci "$GROUP"
        env:
          GROUP: ${{ matrix.group }}

  ci:
    # Runs whatever became of the others: a required check that is skipped counts as passed.
    if: always()
    needs: [groups, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.4
          install_args: just
      - run: just ci-passed $RESULTS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
