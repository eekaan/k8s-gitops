---
# One job with no path filter, so every pull request gets its result.
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; each push to main keeps its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The secrets scan reads every commit, not only the tip.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.4
          install_args: just http:dagger
      - run: just ci
