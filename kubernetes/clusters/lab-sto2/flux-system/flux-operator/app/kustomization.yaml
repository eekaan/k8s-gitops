---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ocirepository.yaml
  - helmrelease.yaml

# The chart's values, as a ConfigMap Flux's substitution leaves alone. kustomizeconfig.yaml points
# the HelmRelease at its hashed name, so a change of values is a change of the release.
configMapGenerator:
  - name: flux-operator-values
    files:
      - values.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
