---
# Released as flux-instance in flux-system, named after this object. The chart names the
# FluxInstance it renders flux.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  annotations:
    # Pruning this release would delete the FluxInstance and with it Flux's controllers, so
    # removing or renaming it in the tree leaves it in place instead.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-instance
  # Not a child of the root, so none of its release defaults apply. A failed upgrade is retried a
  # few times, then rolled back to the release that worked.
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: flux-instance-values
