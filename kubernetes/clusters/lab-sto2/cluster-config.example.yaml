---
# Key names of the cluster-config ConfigMap, with placeholder values. The real values depend on the
# deployment and are applied to the cluster, never committed. scripts/kubernetes-check substitutes
# these placeholders, with those of cluster-secrets.example.yaml, when it builds the tree with
# Flux, so a variable listed in neither fails the check unless the application sets it or it has a
# default. A plain map rather than a ConfigMap, so it cannot be applied over the real one.
CLUSTER_DOMAIN: example.com
# The start of the backup buckets' names: each bucket is this, a hyphen and its role, such as
# example-backups-volsync.
BACKUP_BUCKET_PREFIX: example-backups
# The object storage's S3 endpoint: https, a host name and an optional port, nothing after them.
S3_ENDPOINT: https://s3.example.com
# The region the object storage's S3 clients name.
S3_REGION: example-region
# The node network, as an address prefix.
NODE_CIDR: 192.0.2.0/24
# A regular expression (Go RE2 syntax) that every node name matches in full.
NODE_NAME_REGEX: example-(cp|w)-[0-9]+
