---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Explicit, so the example key lists beside it are never applied: without this file Flux
# generates one from every YAML file in the directory. The instance's sync Kustomization applies
# the root and the Kustomizations of Flux's own operator and instance from here.
resources:
  - ks.yaml
  - flux-system/flux-operator/ks.yaml
  - flux-system/flux-instance/ks.yaml
