---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What this cluster runs: the shared pieces and namespace directories first, then one ks.yaml per
# enabled application. A disabled application stays listed, commented out with the reason.
resources:
  - ../../base/flux-system/artifact-generator
  - ../../base/ai-system
  - ../../base/cert-manager
  - ../../base/cnpg-system
  - ../../base/demo
  - ../../base/envoy-gateway-system
  - ../../base/etcd-snapshots
  - ../../base/external-dns
  - ../../base/external-secrets
  - ../../base/keda
  - ../../base/kube-system
  - ../../base/monitoring
  - ../../base/openbao
  - ../../base/piraeus-datastore
  - ../../base/volsync-system
  - ../../base/ai-system/n8n/ks.yaml
  - ../../base/cert-manager/acme-issuers/ks.yaml
  - ../../base/cert-manager/cert-manager/ks.yaml
  - ../../base/cert-manager/cluster-ca/ks.yaml
  - ../../base/cnpg-system/cloudnative-pg/ks.yaml
  - ../../base/demo/hello-route/ks.yaml
  - ../../base/demo/hello-secret/ks.yaml
  - ../../base/demo/hello/ks.yaml
  - ../../base/demo/volsync-demo/ks.yaml
  - ../../base/envoy-gateway-system/envoy-gateway-crds/ks.yaml
  - ../../base/envoy-gateway-system/envoy-gateway/ks.yaml
  - ../../base/envoy-gateway-system/gateway-public/ks.yaml
  - ../../base/etcd-snapshots/etcd-snapshots/ks.yaml
  - ../../base/external-dns/external-dns/ks.yaml
  - ../../base/external-secrets/external-secrets/ks.yaml
  - ../../base/external-secrets/openbao-store/ks.yaml
  - ../../base/keda/keda/ks.yaml
  - ../../base/kube-system/cilium/ks.yaml
  - ../../base/kube-system/cilium-bgp/ks.yaml
  - ../../base/kube-system/cilium-monitoring/ks.yaml
  - ../../base/kube-system/descheduler/ks.yaml
  - ../../base/kube-system/gateway-api-crds/ks.yaml
  - ../../base/kube-system/kubelet-csr-approver/ks.yaml
  - ../../base/kube-system/metrics-server/ks.yaml
  - ../../base/kube-system/prometheus-operator-crds/ks.yaml
  - ../../base/kube-system/reflector/ks.yaml
  - ../../base/kube-system/reloader/ks.yaml
  - ../../base/kube-system/runtime-classes/ks.yaml
  - ../../base/kube-system/snapshot-controller/ks.yaml
  - ../../base/kube-system/spegel/ks.yaml
  - ../../base/kube-system/vpa/ks.yaml
  - ../../base/monitoring/flux-monitoring/ks.yaml
  - ../../base/monitoring/grafana-operator/ks.yaml
  - ../../base/monitoring/grafana/ks.yaml
  - ../../base/monitoring/kube-prometheus-stack/ks.yaml
  - ../../base/monitoring/openbao-dashboard/ks.yaml
  - ../../base/monitoring/vector/ks.yaml
  - ../../base/monitoring/victoria-logs/ks.yaml
  - ../../base/openbao/openbao/ks.yaml
  - ../../base/piraeus-datastore/linstor-cluster/ks.yaml
  - ../../base/piraeus-datastore/linstor-monitoring/ks.yaml
  - ../../base/piraeus-datastore/piraeus-operator/ks.yaml
  - ../../base/volsync-system/volsync/ks.yaml

patches:
  # The issuer of the public Gateway's certificate, the one place this cluster chooses it: Let's
  # Encrypt's staging CA, whose certificates no client trusts, until the staging certificate is
  # issued; then letsencrypt-production, which every client trusts. Without this patch the
  # certificate comes from the cluster's own CA. Choosing an issuer of acme-issuers names that
  # application in dependsOn, which scripts/kubernetes-check requires.
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: gateway-public
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: acme-issuers
      - op: add
        path: /spec/postBuild
        value:
          substitute:
            PUBLIC_ISSUER: letsencrypt-staging
  # The cluster's name, which owns the DNS records external-dns makes: two clusters that share a
  # zone never touch each other's records. Selected by target, so an overlay that leaves the
  # application out still builds.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: external-dns
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: external-dns
      spec:
        postBuild:
          substitute:
            DNS_OWNER_ID: lab-sto2
