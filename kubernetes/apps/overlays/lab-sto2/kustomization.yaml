---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What this cluster runs: the shared pieces and namespace directories first, then one ks.yaml per
# enabled application. A disabled application stays listed, commented out with the reason.
resources:
  - ../../base/flux-system/artifact-generator
  - ../../base/cert-manager
  - ../../base/cnpg-system
  - ../../base/demo
  - ../../base/envoy-gateway-system
  - ../../base/external-secrets
  - ../../base/kube-system
  - ../../base/monitoring
  - ../../base/piraeus-datastore
  - ../../base/volsync-system
  - ../../base/cert-manager/cert-manager/ks.yaml
  - ../../base/cnpg-system/cloudnative-pg/ks.yaml
  - ../../base/demo/hello/ks.yaml
  # - ../../base/demo/volsync-demo/ks.yaml  # Disabled: no ClusterSecretStore openbao holds the repository's password and S3 key yet, so its movers have no Secret to read
  - ../../base/envoy-gateway-system/envoy-gateway-crds/ks.yaml
  - ../../base/envoy-gateway-system/envoy-gateway/ks.yaml
  - ../../base/external-secrets/external-secrets/ks.yaml
  - ../../base/kube-system/cilium/ks.yaml
  - ../../base/kube-system/descheduler/ks.yaml
  - ../../base/kube-system/gateway-api-crds/ks.yaml
  - ../../base/kube-system/kubelet-csr-approver/ks.yaml
  - ../../base/kube-system/metrics-server/ks.yaml
  - ../../base/kube-system/prometheus-operator-crds/ks.yaml
  - ../../base/kube-system/reloader/ks.yaml
  - ../../base/kube-system/runtime-classes/ks.yaml
  - ../../base/kube-system/snapshot-controller/ks.yaml
  - ../../base/kube-system/spegel/ks.yaml
  - ../../base/monitoring/kube-prometheus-stack/ks.yaml
  - ../../base/piraeus-datastore/linstor-cluster/ks.yaml
  - ../../base/piraeus-datastore/piraeus-operator/ks.yaml
  - ../../base/volsync-system/volsync/ks.yaml
