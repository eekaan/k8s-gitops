---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
# The network check: every hour, three pods on three different workers each make the network
# attempts of expected.tsv, the pod's resolver, the cloud's metadata address, their own node's
# kubelet and Talos API, the API server, hello and the secret store, and fail unless every result is
# the table's for the mode (docs/kubernetes.md, The escape canary). A run that fails raises
# EscapeCanaryUnexpectedResult, three that do not succeed EscapeCanaryStale (prometheusrule.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: escape-canary-network
  labels:
    app.kubernetes.io/name: escape-canary
    app.kubernetes.io/component: network
spec:
  # 23 minutes past every hour in the cluster's UTC, as no CronJob of the tree sets timeZone: a
  # minute no other CronJob of the tree runs at.
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      # A job kubectl create job --from makes takes these labels.
      labels:
        app.kubernetes.io/name: escape-canary
        app.kubernetes.io/component: network
    spec:
      # Three pods at once, one per index, so a result is no single node's.
      completionMode: Indexed
      completions: 3
      parallelism: 3
      # A pod that exits non-zero fails the Job at once, with BackoffLimitExceeded, which the alert on
      # an unexpected result reads; a pod no worker takes fails it at the deadline with
      # DeadlineExceeded, which it does not.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: escape-canary
            app.kubernetes.io/component: network
            # The pods the canary's resolver policy selects.
            k8s-gitops/escape-canary: "true"
        spec:
          restartPolicy: Never
          # Only the rights check holds a token.
          automountServiceAccountToken: false
          # No Service hands the pod variables; the API server's are set whatever this says.
          enableServiceLinks: false
          affinity:
            # Workers only: the control planes carry this label.
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
            # One pod of the Job per node: the API server adds the pod's own controller-uid, which
            # the Job controller gives every pod of a Job, to the selector, so another Job's pods
            # do not count, and the scheduler counts no pod that has ended. A run whose third pod
            # finds no worker free of the other two fails at its deadline.
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: escape-canary
                      app.kubernetes.io/component: network
                  matchLabelKeys:
                    - batch.kubernetes.io/controller-uid
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: network
              # The busybox of the drill's check and Robot Framework's report server, by its tag and
              # the digest of its image index: its sh, nc, nslookup and timeout run the check.
              image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command: ["/bin/sh", "/scripts/network.sh"]
              env:
                - name: CANARY_MODE
                  value: ${ESCAPE_CANARY_MODE}
                - name: CANARY_TABLE
                  value: /table/expected.tsv
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              # The drill's check's figures, for the same image.
              resources:
                requests:
                  cpu: 1m
                  memory: 8Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: table
                  mountPath: /table
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: escape-canary-scripts
            - name: table
              configMap:
                name: escape-canary-expected
