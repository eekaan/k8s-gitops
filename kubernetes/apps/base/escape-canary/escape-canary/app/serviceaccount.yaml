---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
# The rights check's account, which no Role or binding of the tree names: its requests are the API
# server's to refuse (docs/kubernetes.md, The escape canary). It mounts no token for a pod that does
# not ask for one; the rights check's pods ask.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: escape-canary-rights
automountServiceAccountToken: false
