---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-feature-operator
  namespace: flux-system
spec:
  path: ./apps/base/open-feature-operator/open-feature-operator/app
  targetNamespace: open-feature-operator
  # What its objects need to exist first. The release's two Certificates name the ClusterIssuer
  # cluster-ca, whose application waits for cert-manager and is Ready once the issuer signs; the
  # application's PodMonitor is a kind that exists once prometheus-operator-crds is Ready; and its
  # CiliumNetworkPolicies are a kind Cilium's operator defines.
  dependsOn:
    - name: cluster-ca
    - name: prometheus-operator-crds
    - name: cilium
  # Ready only once the release is installed and its pod is ready, so an application that names
  # this one in dependsOn finds the definitions of the flag kinds and a webhook that answers.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: open-feature-operator
