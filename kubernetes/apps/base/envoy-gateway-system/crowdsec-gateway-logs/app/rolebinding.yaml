---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
# The agent's account, in its own namespace, and no other subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-agent-gateway-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-agent-gateway-logs
subjects:
  - kind: ServiceAccount
    name: crowdsec-agent
    namespace: crowdsec
