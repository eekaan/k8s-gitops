---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-public
  namespace: flux-system
  labels:
    # The certificate is issued and the proxies pull their image and start before it is Ready.
    k8s-gitops/timeout: long
spec:
  path: ./apps/base/envoy-gateway-system/gateway-public/app
  targetNamespace: envoy-gateway-system
  # The controller serves the Gateway and starts the proxies, cluster-ca signs the listener's
  # certificate, and cilium-bgp holds the pool and the advertisement that give the proxies' Service
  # its address and announce it.
  dependsOn:
    - name: envoy-gateway
    - name: cluster-ca
    - name: cilium-bgp
  # Ready only once the certificate is issued and the Gateway is programmed, which the controller
  # reports once the proxies' Service has the address it asked for. Without a Ready condition of
  # its own a Gateway counts as ready, so its condition is read.
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Programmed' && e.status == 'True')
  sourceRef:
    kind: ExternalArtifact
    name: gateway-public
