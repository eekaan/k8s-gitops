---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
# The https listener's certificate, for every host under the cluster's domain and for the domain
# itself. Its issuer is the one line that changes when the public issuer of ADR 0006 exists:
# issuerRef names the cluster's own authority until then (docs/kubernetes.md, cert-manager).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-wildcard
spec:
  secretName: public-wildcard-tls
  dnsNames:
    - "*.${CLUSTER_DOMAIN}"
    - "${CLUSTER_DOMAIN}"
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
