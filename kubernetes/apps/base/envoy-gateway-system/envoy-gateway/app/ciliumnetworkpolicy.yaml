---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What the Envoy Gateway controller lets through, on top of the namespace's default deny: the proxies
# fetch their configuration and the firewall's Wasm modules from it and the kubelet probes it; it
# reaches the API server and the cluster's resolver. The proxies are configured over the connection
# they open to it. No monitor of the tree scrapes its metrics. The API server's calls to its webhook
# and the controller's fetches from an image registry are the next policies'.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway
spec:
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The proxies' configuration, served over xDS, and the Wasm modules of the firewall's policies
    # (components/waf), which each replica serves from its own cache over TLS on 18002.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
            - port: "18002"
              protocol: TCP
    # The kubelet's probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The API server, where the controller reads the Gateway API's objects and writes the proxies'
    # Deployment, Service and status. A Service's address is translated to the control plane's before
    # policy applies, so 6443 is the port that counts.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# The topology injector's admission webhook, which the API server calls from the control planes' host
# network. A call another node's host sends crosses the tunnel as a remote node (bpf/bpf_overlay.c),
# which Cilium names the API server only for an address it knows as the API server's; a call from
# the node the pod runs on comes from the host. The rule names all three, on the webhook's port alone.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-webhook
  annotations:
    k8s-gitops/network-policy-reason: >-
      the API server calls the webhook from the control planes' host network, and a call from another
      node reaches the pod as remote-node unless Cilium knows its source address as the API server's;
      port 9443 only
spec:
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# The image registry each controller replica fetches a Wasm module from when it translates a policy
# that names one (components/waf): ghcr.io, which answers a blob request with a redirect to another
# host. A DNS name rule would need both names, and Cilium's DNS proxy to read them, which no policy
# of the tree uses, so the rule is the world on 443, the port https reaches both on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-registry
  annotations:
    k8s-gitops/network-policy-reason: >-
      the controller fetches the firewall's Wasm module from its image's registry, which redirects a
      blob request to another host, so a DNS name rule would need both names and the DNS proxy no
      policy of the tree uses; port 443 only
spec:
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# The certificate job that makes the controller's own certificates before each install and upgrade:
# it reads and writes Secrets through the API server and takes no connection.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-certgen
spec:
  endpointSelector:
    matchLabels:
      app: certgen
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What the public Gateway's proxies let through, on top of the namespace's default deny; no monitor
# of the tree scrapes their metrics. The
# controller makes the proxies at run time with the labels below, which the EnvoyProxy of
# gateway-public names in its spread constraint too; the policy is this application's, with the
# controller's, because the proxies are the controller's pods.
#
# Public traffic arrives from the edge routers, which translate it (ADR 0018), at the address the
# workers announce, and the node that took the connection may forward it to a proxy on another node
# (externalTrafficPolicy Cluster). Either way the proxy sees the world: Cilium sends a load-balanced
# connection from outside the cluster through the tunnel to another node with the world's identity
# (bpf/lib/nodeport.h), so the rule allows the world, on the listener ports alone. The listeners
# are on the container ports the controller derives from the Gateway's: 80 and 443 are privileged,
# so it adds 10000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
      gateway.envoyproxy.io/owning-gateway-name: public
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # The blackbox exporter's probes of the public hostnames (docs/kubernetes.md, Probes). A Probe's
    # target is the proxies' Service by its cluster name, whose address Cilium translates to a
    # proxy's before policy applies, so the connection arrives from the exporter's pod, which is no
    # world, on the listener port of the target's scheme. The pods the exporter's Service selects, by
    # the labels its chart gives them; tests/network-policy.bats fails unless they are the only pods
    # of the cluster taken on these ports.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/instance: blackbox-exporter
            app.kubernetes.io/name: prometheus-blackbox-exporter
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # The kubelet's probes: Envoy Gateway probes the envoy container on its readiness port, 19003,
    # and the shutdown manager on 19002. The pinned Cilium lets the local host reach its pods
    # whatever the policies say; the rule states the ports, so that the offline evaluation proves
    # them, and admits the probes if the agents ever require a rule for the local host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "19003"
              protocol: TCP
            - port: "19002"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The controller, which serves the proxies' configuration on 18000 and the Wasm modules of the
    # firewall's policies on 18002 (components/waf): the proxies fetch a module from the controller,
    # never from its registry.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": envoy-gateway-system
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
            - port: "18002"
              protocol: TCP
    # The routed backends, one rule for each: the pods its Service selects, in its namespace while
    # that carries the label the Gateway's https listener selects routes by, on the container port
    # the route sends to and no other. A backend in a namespace with the default deny still has to
    # allow the proxies itself; a listed namespace takes them on every port, so its rule is what
    # keeps them off its other pods and ports, n8n's database among them. A route to another backend
    # or port adds its rule or port here; tests/network-policy.bats fails until the rules name, in
    # each labelled namespace, exactly the ports its routes send to.
    # hello's 8080 in demo.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": demo
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/name: hello
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # n8n's 5678 in ai-system.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": ai-system
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/controller: n8n
            app.kubernetes.io/instance: n8n
            app.kubernetes.io/name: n8n
      toPorts:
        - ports:
            - port: "5678"
              protocol: TCP
    # kromgo's 8080 in kromgo.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kromgo
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/controller: kromgo
            app.kubernetes.io/instance: kromgo
            app.kubernetes.io/name: kromgo
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Open WebUI's 8080 in ai-system.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": ai-system
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/controller: open-webui
            app.kubernetes.io/instance: open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # dex's 5556 in sso-system, the sign-in's issuer.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": sso-system
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/name: dex
            app.kubernetes.io/instance: dex
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
    # oauth2-proxy's 4180 in sso-system: the routes of the sign-in host and of each opting route's
    # /oauth2/, and the external authorisation the proxies ask of it for each request of a route that
    # opts in (components/sso), which is no route but reaches the same port.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": sso-system
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    # Backstage's 7007 in backstage.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": backstage
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app.kubernetes.io/controller: backstage
            app.kubernetes.io/instance: backstage
            app.kubernetes.io/name: backstage
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP
    # VictoriaLogs' 9428 in monitoring, for the route logs to the store's interface and queries.
    # monitoring is listed and takes the proxies on every port, so this rule is what keeps them off
    # Prometheus, Grafana, Alertmanager and every other pod and port there.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:io.cilium.k8s.namespace.labels.k8s-gitops/gateway": public
            app: server
            app.kubernetes.io/instance: victoria-logs
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
