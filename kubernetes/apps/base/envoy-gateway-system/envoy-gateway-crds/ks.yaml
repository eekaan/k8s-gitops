---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  path: ./apps/base/envoy-gateway-system/envoy-gateway-crds/app
  targetNamespace: envoy-gateway-system
  # Ready only once the inner Kustomization in app/ has established every definition, so the
  # controller, which names this one in dependsOn, finds them in place.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: envoy-gateway-crds
