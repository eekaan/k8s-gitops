---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: flux-system
spec:
  path: ./apps/base/keda/keda/app
  targetNamespace: keda
  # Its chart makes ServiceMonitors, a kind that exists once prometheus-operator-crds is Ready.
  dependsOn:
    - name: prometheus-operator-crds
  # Ready only once the release is installed and its pods are ready, so an application that names
  # this one in dependsOn finds KEDA's definitions and webhook in place.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: keda
