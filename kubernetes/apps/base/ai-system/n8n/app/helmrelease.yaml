---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  # The values, which Flux does not substitute: the settings that depend on the cluster's domain
  # are in spec.values, which it does. The pod's user and security context are in the values in
  # full, not taken from the namespace's app-template-defaults ConfigMap, as the render that
  # validates the tree reads only the ConfigMaps an application builds itself.
  valuesFrom:
    - kind: ConfigMap
      name: n8n-values
  values:
    controllers:
      n8n:
        containers:
          main:
            env:
              # The name the route gives n8n, from which n8n builds the links it shows and the
              # webhook URLs it hands out. The Gateway terminates TLS, so n8n serves plain HTTP
              # behind it while it names itself as https.
              N8N_HOST: n8n.${CLUSTER_DOMAIN}
              N8N_PROTOCOL: https
              N8N_EDITOR_BASE_URL: https://n8n.${CLUSTER_DOMAIN}
              N8N_WEBHOOK_URL: https://n8n.${CLUSTER_DOMAIN}/
