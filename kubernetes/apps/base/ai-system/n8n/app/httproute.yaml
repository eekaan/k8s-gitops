---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# n8n's public name: n8n under the cluster's domain, on the public Gateway's https listener, which
# this namespace reaches through its k8s-gitops/gateway label. The Service is the chart's, named
# after the release, and the port is the one n8n listens on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - n8n.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: n8n
          port: 5678
