---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: open-webui
  # The values, which Flux does not substitute: the settings that depend on the cluster's domain
  # are in spec.values, which it does. The pod's user and security context are in the values in
  # full, not taken from the namespace's app-template-defaults ConfigMap, as the render that
  # validates the tree reads only the ConfigMaps an application builds itself.
  valuesFrom:
    - kind: ConfigMap
      name: open-webui-values
  values:
    controllers:
      open-webui:
        containers:
          main:
            env:
              # The name the route gives Open WebUI: the one origin it allows, and the address it
              # builds links and redirects from. The Gateway terminates TLS, so Open WebUI serves
              # plain HTTP behind it while it names itself as https.
              CORS_ALLOW_ORIGIN: https://open-webui.${CLUSTER_DOMAIN}
              WEBUI_URL: https://open-webui.${CLUSTER_DOMAIN}
