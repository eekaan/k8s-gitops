---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-monitoring
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/flux-monitoring/app
  targetNamespace: monitoring
  # Flux is installed before the monitoring definitions exist, so the operator's chart makes no
  # monitor: this application makes the monitors of Flux's controllers and of the operator once the
  # definitions of the monitoring kinds are in place.
  dependsOn:
    - name: prometheus-operator-crds
  sourceRef:
    kind: ExternalArtifact
    name: flux-monitoring
