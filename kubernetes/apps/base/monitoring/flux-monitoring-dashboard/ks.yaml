---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-monitoring-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/flux-monitoring-dashboard/app
  targetNamespace: monitoring
  # The dashboard reads what the monitors of flux-monitoring scrape and belongs to them: the cluster
  # that does not scrape Flux does not run this either, and kubernetes-check refuses one that lists
  # this without it. It is its own application, so that Flux's monitors and alerts never wait for
  # the Grafana operator. Its kind exists once grafana-operator is Ready.
  dependsOn:
    - name: flux-monitoring
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: flux-monitoring-dashboard
