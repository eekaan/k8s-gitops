---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/falco-dashboard/app
  targetNamespace: monitoring
  # The dashboard describes Falco and belongs to it: the cluster that does not run Falco does not
  # run this either, and kubernetes-check refuses one that lists this without it. It is its own
  # application, in monitoring, because the Grafana operator acts in monitoring only, and so that
  # Falco itself never waits for the Grafana operator. Its kind exists once grafana-operator is
  # Ready.
  dependsOn:
    - name: falco
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: falco-dashboard
