---
# Falco's dashboard from its chart, unchanged: the rules that matched, by rule, source and
# priority, Falco's memory and CPU, the events it reads and the ones it drops, and the versions and
# engines that run. It declares no input: its panels name the variable datasource, which lists the
# datasources of type prometheus and takes the tree's one, whatever value the file saved for it, so
# nothing is mapped here. One target names a datasource by a uid no datasource has, in a panel
# whose own datasource is the variable: Grafana runs a target against its panel's datasource
# unless the panel's is the mixed one, so the target's is never read (transformSingleQuery in
# apps/dashboard/pkg/migration/conversion/v1_to_v2alpha1.go of Grafana v13.1.3). The file carries
# an id, which the operator sets to null before it sends the dashboard (getContentModel in
# controllers/content/resolver.go of grafana-operator v5.25.0). Falco takes a new snapshot of the
# counters its endpoint serves once a second, whatever metrics.interval is, and reads the rules'
# counters at each scrape (prometheus_metrics_refresh_interval in
# userspace/falco/app/metrics_snapshot.h and falco_to_text_prometheus in
# userspace/falco/falco_metrics.cpp of Falco 0.45.2), so a rate over a scrape interval reads as on
# any other target. The panels that stay empty here are in docs/kubernetes.md
# (Dashboards). The JSON is the ConfigMap kustomize generates from dashboards/falco.json; a new
# chart means taking the file from it again, and tests/dashboards.bats fails until the committed
# file is the pinned chart's, byte for byte, and the record is the chart's version.
# Source: https://github.com/falcosecurity/charts/blob/falco-9.2.2/charts/falco/dashboards/falco-dashboard.json
# Licence: Apache-2.0
# SHA-256: d2cccaf1105f033a9eb71435848c9167a848d651b90d8573529179572b8a24ec
# Chart-path: dashboards/falco-dashboard.json
# dashboard-falco: 9.2.2
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: falco
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  # A restarted Grafana starts without it. The operator applies it again every minute, and after an
  # attempt that fails, as while Grafana starts, tries again at once and then after a wait that
  # doubles with each failure, up to about 17 minutes, until one succeeds.
  resyncPeriod: 1m
  folder: Falco
  configMapRef:
    name: grafana-dashboard-falco
    key: falco.json
