---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-route
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/victoria-logs-route/app
  targetNamespace: monitoring
  # The component adds the policy that asks oauth2-proxy and the route for the sign-in paths.
  components:
    - ../../../../../components/sso
  postBuild:
    substitute:
      SSO_ROUTE: logs
      SSO_HOSTNAME: logs
  # The route names the public Gateway and vmauth's Service, its filter the Secret vmauth-logs-route
  # that vmauth's application writes, and the policy oauth2-proxy's Service, which the grant in its
  # namespace lets this one reach. A cluster without any of them cannot enable it, and the route is
  # applied only once vmauth and oauth2-proxy are Ready, so no request reaches the store before the
  # sign-in can answer for it. That vmauth admits the route's credential rests on the Secret, not on
  # this order, which a change to both does not hold (vector's ks.yaml says why): the filter injects
  # nothing, and the rule answers an error, until the Secret exists, and vmauth reads the same
  # value, written once. Its Probe is answered by the blackbox exporter.
  dependsOn:
    - name: gateway-public
    - name: vmauth
    - name: oauth2-proxy
    - name: blackbox-exporter
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: victoria-logs-route
