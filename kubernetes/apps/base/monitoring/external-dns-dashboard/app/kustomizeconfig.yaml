---
# Lets kustomize write the generated ConfigMap's hashed name into the dashboard's configMapRef, so a
# change to its JSON produces a new ConfigMap for the operator to load.
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/configMapRef/name
        group: grafana.integreatly.org
        version: v1beta1
        kind: GrafanaDashboard
