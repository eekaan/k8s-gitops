---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/external-dns-dashboard/app
  targetNamespace: monitoring
  # The dashboard describes external-dns and belongs to it: the cluster that does not run
  # external-dns does not run this either, and kubernetes-check refuses one that lists this without
  # it. It is its own application, in monitoring, because the Grafana operator acts in monitoring
  # only, and so that external-dns itself never waits for the Grafana operator. Its kind exists
  # once grafana-operator is Ready.
  dependsOn:
    - name: external-dns
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: external-dns-dashboard
