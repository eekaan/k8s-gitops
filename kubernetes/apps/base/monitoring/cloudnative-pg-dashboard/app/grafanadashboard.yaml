---
# CloudNativePG's dashboard for a PostgreSQL cluster, unchanged: the instances' health,
# configuration, activity, storage, write-ahead log, replication and checkpoints, and the operator's
# reconciles. The operator's chart carries it in the chart cluster of the project's
# grafana-dashboards repository, a dependency it takes for monitoring.grafanaDashboard.create, which
# stays off: that would make a ConfigMap for a Grafana sidecar, which this Grafana has none of. The
# record is that dependency's version, not the operator chart's.
#
# The file declares two inputs, and both are mapped. Its panels name the datasource
# ${DS_PROMETHEUS}, which the operator replaces with the name of the tree's Prometheus before it
# loads the dashboard. One target is an expression, of the datasource ${DS_EXPRESSION}: it is
# mapped to __expr__, the uid of Grafana's own expression datasource (DatasourceUID in
# pkg/expr/service.go of Grafana v13.1.3), which is no datasource of the tree; the operator writes
# any text it is given in an input's place (resolveDatasources in controllers/content/resolver.go
# of grafana-operator v5.25.0). Nine of its rows, and the placeholder target each of them carries,
# name a datasource by the uid prometheus, which no datasource has: Grafana runs no query for a row,
# so nothing reads them.
#
# The JSON is the ConfigMap kustomize generates from dashboards/cloudnative-pg.json; a new chart
# means taking the file from it again, and tests/dashboards.bats fails until the committed file is
# the pinned chart's, byte for byte, and the record is the version of the chart that holds it.
# Source: https://github.com/cloudnative-pg/grafana-dashboards/blob/cluster-v0.0.5/charts/cluster/grafana-dashboard.json
# Licence: Apache-2.0
# SHA-256: 676b10ae3a8850108d484e4491739207b2ad1ebca44300472168d81a8788e4fb
# Chart-path: charts/cluster/grafana-dashboard.json
# dashboard-cloudnative-pg: 0.0.5
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cloudnative-pg
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  # A restarted Grafana starts without it. The operator applies it again every minute, and after an
  # attempt that fails, as while Grafana starts, tries again at once and then after a wait that
  # doubles with each failure, up to about 17 minutes, until one succeeds.
  resyncPeriod: 1m
  folder: PostgreSQL
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
    - inputName: DS_EXPRESSION
      datasourceName: __expr__
  configMapRef:
    name: grafana-dashboard-cloudnative-pg
    key: cloudnative-pg.json
