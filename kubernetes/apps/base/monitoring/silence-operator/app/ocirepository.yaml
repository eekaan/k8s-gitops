---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
# The silence operator's chart from its publisher's OCI registry, where the operator's
# documentation says each release's chart is published.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: silence-operator
spec:
  # The tag is pinned: a new chart arrives by a change to this file, which Flux applies at once.
  interval: 12h
  # The chart's packaged layer, which helm-controller reads as it is.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
  ref:
    # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/silence-operator
    tag: 0.22.0
