---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silence-operator
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/silence-operator/app
  targetNamespace: monitoring
  # Its chart makes a PodMonitor, a kind that exists once prometheus-operator-crds is Ready. The
  # Alertmanager is not a dependency: the operator is Ready without it and tries again until the
  # Service answers.
  dependsOn:
    - name: prometheus-operator-crds
  # Ready only once the release is installed and the operator runs, so an application that names
  # this one in dependsOn finds the Silence definitions in place.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: silence-operator
