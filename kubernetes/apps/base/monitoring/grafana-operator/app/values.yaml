---
# Values for the Grafana operator's chart, read by the HelmRelease through a ConfigMap generated
# without substitution. Keys not set here keep the chart's defaults, among them leader election.

# The operator watches only its own namespace, monitoring, where the Grafana and every object for it
# live, and its service account gets a Role there and no ClusterRole: it can create, read, change
# and delete Secrets, ConfigMaps, Services, service accounts, claims, Deployments, Ingresses and
# HTTPRoutes in monitoring only. Watching another namespace gives it those rights there too, and
# watching all of them gives it them in every namespace.
namespaceScope: true
rbac:
  useClusterRole: false

crds:
  # The release installs and upgrades the operator's resource definitions as templates, as the
  # chart's documentation describes for upgrades without a manual step, so they always match the
  # operator that serves them; in the default, immutable mode they would come from a crds/
  # directory, which Helm itself never upgrades. The chart marks them helm.sh/resource-policy: keep,
  # so Helm leaves them when the release is uninstalled, as it is when this application leaves the
  # tree: deleting a definition deletes every object of its kind.
  immutable: false

# One operator. Nothing calls it: it serves no webhook, and Grafana keeps serving while it is down.
# A drain only delays applying a change from Git until the operator runs on another node, and a
# disruption budget for one replica would block every drain.
replicas: 1
# The requests of the publisher's own manifests for the operator. No limits: its memory grows with
# the objects it watches.
resources:
  requests:
    cpu: 100m
    memory: 20Mi

serviceMonitor:
  enabled: true

# The chart sets no seccomp profile; the runtime's default is what the restricted Pod Security level
# requires. Its container context already meets the rest.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
