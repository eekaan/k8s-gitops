---
# The credential of each of vmauth's users and the keys of its own endpoints. Nobody needs to know
# them, so no person makes them: External Secrets generates each here, 32 characters hex-encoded
# into 64 hexadecimal digits, and writes it into its Secret once. Each Secret is read only through
# the cluster's API, and nothing else keeps it.
#
# With refreshPolicy CreatedOnce the operator writes a Secret on the first sync and not on a
# schedule, and writes it again, with a new value, only when the Secret is changed or deleted or its
# ExternalSecret is made again. vmauth and the collector read theirs from their environment when
# they start, so after that each is restarted by hand; Grafana's datasource, the route and just
# logs read theirs again by themselves (docs/kubernetes.md, Who may call the log store).
#
# The collector's, read by vmauth and by the collector's pods, each from its environment.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-vector
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-vector
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-vector
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-vector
---
# Grafana's, read by vmauth from its environment and by the Grafana operator, which puts it into
# the datasource VictoriaLogs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-grafana
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-grafana
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-grafana
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-grafana
---
# The route logs': vmauth reads the password from its environment, and Envoy Gateway puts the key
# credential, the Basic value of the user logs-route, in the header Authorization of each request
# the route sends to vmauth. The template keeps the generated key beside its own: with Merge, the
# Secret holds both.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-logs-route
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-logs-route
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-logs-route
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        credential: 'Basic {{ printf "logs-route:%s" .password | b64enc }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-logs-route
---
# The operator's, for just logs and just network-audit: vmauth reads the password from its
# environment, and the recipe reads the key authorization, the Basic value of the user operator,
# through the kubeconfig at each run.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-operator
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-operator
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-operator
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        authorization: 'Basic {{ printf "operator:%s" .password | b64enc }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-operator
---
# The keys of vmauth's /flags, /debug/pprof and /-/reload, each a file vmauth reads again while it
# runs, so a key made again reaches it without a restart. Nothing else reads them.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-keys
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - flags
    - pprof
    - reload
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-keys
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-keys
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-keys
