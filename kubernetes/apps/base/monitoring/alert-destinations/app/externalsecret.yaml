---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Where Alertmanager sends: the address of the notification webhook and the address of the
# heartbeat, the keys notify-url and heartbeat-url of monitoring/alert-destinations in the store,
# which an operator writes with `just bao-put monitoring/alert-destinations notify-url` and
# `just bao-put monitoring/alert-destinations heartbeat-url` (docs/kubernetes.md, Where alerts
# go). They become the two keys of the Secret alert-destinations, which Alertmanager mounts as
# files and reads at each notification. Two data entries, so the Secret holds those two keys and
# nothing else the store's entry may hold. While either is missing from the store the
# ExternalSecret reports it and writes no Secret, and Alertmanager, which runs without the files,
# sends nothing. Neither address is in a file of this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-destinations
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alert-destinations
    creationPolicy: Owner
  data:
    - secretKey: notify-url
      remoteRef:
        key: monitoring/alert-destinations
        property: notify-url
    - secretKey: heartbeat-url
      remoteRef:
        key: monitoring/alert-destinations
        property: heartbeat-url
