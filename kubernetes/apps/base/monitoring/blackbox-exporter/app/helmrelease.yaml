---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  valuesFrom:
    - kind: ConfigMap
      name: blackbox-exporter-values
    # What the probes verify the Gateway's certificate against: the values of the issuer the
    # cluster chooses in its overlay, the cluster's own CA unless it chooses (docs/kubernetes.md,
    # Probes). An issuer the probes hold no values for has no key, and the release fails rather than
    # probe without them.
    - kind: ConfigMap
      name: blackbox-exporter-trust-values
      valuesKey: ${PROBE_ISSUER:=cluster-ca}.yaml
