---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
# The blackbox exporter's chart from the Prometheus community's public OCI registry. It installs no
# resource definitions; its ServiceMonitor's kind comes from prometheus-operator-crds.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: blackbox-exporter
spec:
  # The tag is pinned: a new chart arrives by a change to this file, which Flux applies at once.
  interval: 12h
  # The chart's packaged layer, which helm-controller reads as it is.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
  ref:
    # renovate: datasource=docker depName=ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
    tag: 11.21.3
