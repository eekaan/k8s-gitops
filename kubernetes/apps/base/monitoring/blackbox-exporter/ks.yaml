---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blackbox-exporter
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/blackbox-exporter/app
  targetNamespace: monitoring
  # The chart makes a ServiceMonitor and the application a PrometheusRule, whose kinds exist once
  # prometheus-operator-crds is Ready, and a Certificate that the cluster's authority signs, which
  # the exporter reads the authority's public certificate from.
  dependsOn:
    - name: prometheus-operator-crds
    - name: cluster-ca
  # Ready only once the exporter runs and the certificate is issued, so an application that
  # declares a Probe and names this one in dependsOn finds an exporter to answer it.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: blackbox-exporter
