---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/victoria-logs/app
  targetNamespace: monitoring
  # The chart creates a ServiceMonitor, whose kind exists once prometheus-operator-crds is Ready;
  # the dashboard is a GrafanaDashboard, whose kind exists once grafana-operator is; the store's
  # credential is a Password generator and an ExternalSecret, External Secrets' kinds.
  dependsOn:
    - name: prometheus-operator-crds
    - name: grafana-operator
    - name: external-secrets
  # Ready once the store's release is and its credential is written: vmauth, which sends to the
  # store with that credential, waits for it.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: victoria-logs
