---
# The store's own credential: the user victoria-logs and its password, which Prometheus presents
# when it scrapes the store, and its Basic value, which vmauth sends with every request it forwards
# to the store in place of its client's. Nobody needs to know it, so no person makes it: External
# Secrets generates it here, 32 characters hex-encoded into 64 hexadecimal digits, and writes it
# into the Secret victoria-logs-auth once, which nothing else keeps; it is read only through the
# cluster's API. The template keeps the generated key beside its own: with Merge, the Secret holds
# username, password and authorization.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: victoria-logs-auth
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
# With refreshPolicy CreatedOnce the operator writes the Secret on the first sync and not on a
# schedule, and writes it again, with a new value, only when the Secret is changed or deleted or
# the ExternalSecret is made again. vmauth reads it from its environment when it starts, so after
# that it is restarted by hand, and Prometheus' scrape follows by itself (docs/kubernetes.md, Who
# may call the log store).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: victoria-logs-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: victoria-logs-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: victoria-logs
        authorization: 'Basic {{ printf "victoria-logs:%s" .password | b64enc }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: victoria-logs-auth
