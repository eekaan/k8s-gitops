---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/cert-manager-dashboard/app
  targetNamespace: monitoring
  # The dashboard describes cert-manager and belongs to it: the cluster that does not run
  # cert-manager does not run this either, and kubernetes-check refuses one that lists this without
  # it. It is its own application, in monitoring, because the Grafana operator acts in monitoring
  # only, and so that cert-manager itself never waits for the Grafana operator. Its kind exists
  # once grafana-operator is Ready.
  dependsOn:
    - name: cert-manager
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager-dashboard
