---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/openbao-dashboard/app
  targetNamespace: monitoring
  # The dashboard describes OpenBao and belongs to it: the cluster that does not run OpenBao does not
  # run this either, and kubernetes-check refuses one that lists this without it. It is its own
  # application, in monitoring, because the Grafana operator acts in monitoring only, and an
  # application's targetNamespace puts everything it applies in that application's namespace. Its
  # kind exists once grafana-operator is Ready.
  dependsOn:
    - name: openbao
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: openbao-dashboard
