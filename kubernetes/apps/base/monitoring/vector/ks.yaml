---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/vector/app
  targetNamespace: monitoring
  # The chart creates a PodMonitor, whose kind exists once prometheus-operator-crds is Ready. The
  # collector does not wait for the store: it holds what it gathers until the store answers.
  dependsOn:
    - name: prometheus-operator-crds
  sourceRef:
    kind: ExternalArtifact
    name: vector
