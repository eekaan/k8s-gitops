---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 30m
  # An upgrade replaces the collector node by node.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: vector
  valuesFrom:
    - kind: ConfigMap
      name: vector-values
