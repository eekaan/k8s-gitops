---
# Log volume by namespace and by node, and the logs of the namespaces and pods chosen above them, from
# the VictoriaLogs datasource. Its JSON is the ConfigMap kustomize generates from dashboards/logs.json.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: logs
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  # A restarted Grafana starts without it. The operator applies it again every minute, and retries
  # a failed attempt after 10 seconds, doubling the wait up to two minutes while Grafana starts.
  resyncPeriod: 1m
  folder: Logs
  configMapRef:
    name: grafana-dashboard-logs
    key: logs.json
