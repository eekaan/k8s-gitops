---
# The cluster's VictoriaLogs, through the Service its chart puts in front of it (ADR 0014). Grafana's
# server queries it, so a browser needs no way to it. The type is the VictoriaLogs plugin's, which
# Grafana does not ship.
#
# This is the one thing Grafana fetches from the network. The operator hands the plugin below to
# Grafana's container as GF_INSTALL_PLUGINS, and grafana.yaml sets GF_INSTALL_PLUGINS_FORCE there,
# so that the image's entrypoint runs `grafana cli plugins install victoriametrics-logs-datasource
# <version>` before it starts Grafana, at every start. That downloads the plugin's archive, at
# exactly that version, from grafana.com's plugin catalogue
# (https://grafana.com/api/plugins/victoriametrics-logs-datasource/versions/<version>/download).
# Grafana's own server would install it only with plugins.preinstall_disabled off, which would let it
# install its list of plugins as well. The entrypoint runs under set -e: a failed download stops
# Grafana from starting. Grafana verifies a plugin's signature against the public key it ships when
# it loads it. The plugin is an Apache-2.0 release of its publisher's,
# VictoriaMetrics/victorialogs-datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  # A restarted Grafana starts without it. The operator applies it again every minute, and retries
  # a failed attempt after 10 seconds, doubling the wait up to two minutes while Grafana starts.
  resyncPeriod: 1m
  # The dashboard names the datasource by this, so it finds it however Grafana numbers its own.
  uid: victoria-logs
  plugins:
    - name: victoriametrics-logs-datasource
      # renovate: datasource=github-releases depName=VictoriaMetrics/victorialogs-datasource
      version: 0.34.0
  datasource:
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs.monitoring.svc:9428
