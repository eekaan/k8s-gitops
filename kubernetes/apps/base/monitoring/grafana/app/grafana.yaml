---
# The one Grafana, which the operator runs as the Deployment grafana-deployment behind the Service
# grafana-service, port 3000, inside the cluster only. The operator writes the admin user, admin,
# and a random password into the Secret grafana-admin-credentials when it first creates it, and
# keeps them while the Grafana exists. Grafana's data directory is an emptyDir: its datasource and
# dashboards come from Git, and the operator applies them again within a few minutes of a restart.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    # The datasource and the dashboards select this Grafana by this label, and the ServiceMonitor
    # selects its Service by it, which the operator copies there.
    app.kubernetes.io/instance: grafana
spec:
  # Without a version the operator writes its own default here once, and it never changes again.
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: 13.1.3
  config:
    # Logs go to the container's output only, not also to a file in the pod.
    log:
      mode: console
    # Grafana's own default; only the admin signs in, through the login form.
    auth.anonymous:
      enabled: "false"
    # Grafana reaches the internet on its own unless told not to: usage counters to
    # stats.grafana.org, checks for newer Grafana and plugin releases and the news feed from
    # grafana.com, profile pictures from gravatar.com and snapshots published to
    # snapshots.raintank.io. Everything it runs comes from Git and the image instead.
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
      check_for_plugin_updates: "false"
    news:
      news_feed_enabled: "false"
    plugins:
      # Grafana otherwise installs a list of plugins from grafana.com at every start, unpinned and
      # updated, into a data directory that starts empty each time; with this off it also ignores
      # the plugins a GrafanaDashboard asks for, so a dashboard uses only those in the image.
      preinstall_disabled: "true"
      # No plugin catalogue to install or update plugins from grafana.com.
      plugin_admin_enabled: "false"
      # The image's plugins are verified with the key Grafana ships; none is fetched.
      public_key_retrieval_disabled: "true"
    security:
      disable_gravatar: "true"
    snapshots:
      external_enabled: "false"
  deployment:
    spec:
      # Each replica would keep a database of its own, and the operator writes to whichever one the
      # Service picks. A drain restarts the one replica on another node, and a disruption budget for
      # it would only block the drain.
      replicas: 1
      # The pod's part of what the restricted Pod Security level requires; the operator merges it
      # into the Deployment it makes, whose grafana container it already runs as a non-root user
      # with no privilege escalation and no capabilities.
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
