---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana.yaml
  - grafanadatasource.yaml
  - grafanadatasource-victoria-logs.yaml
  - grafanadashboard-logs.yaml
  - grafanadashboard-home.yaml
  - servicemonitor.yaml
  - ocirepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: grafana-dashboards-values
    files:
      - values.yaml
  - name: grafana-dashboard-logs
    files:
      - logs.json=dashboards/logs.json
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

configurations:
  - kustomizeconfig.yaml
