---
# Values for the kube-prometheus-stack chart, read by the HelmRelease through a ConfigMap generated
# without substitution. Keys not set here keep the chart's defaults: the Prometheus Operator and
# kube-state-metrics with one replica each, node-exporter on every node, the chart's alerting and
# recording rules, and scrape targets for the API server, the kubelets, CoreDNS, the controller
# manager and the scheduler. Talos labels the last two as upstream does, so the chart's defaults
# find them, on the secure ports talos/patches/controlplane/metrics.yaml opens to the cluster.
#
# The requests below fit three workers of 6 vCPUs and 16 GB each with room to spare: together less
# than half a CPU and 2 GiB, most of it Prometheus's. Nothing sets a memory limit: a Prometheus
# killed for memory replays its write-ahead log on start, which needs as much again.

# The prometheus-operator-crds application installs the monitoring.coreos.com definitions, for the
# operator version this chart runs; the chart installs none. helm-controller leaves out a disabled
# subchart before it collects the definitions to create, so the release defaults find none.
crds:
  enabled: false

# This release installs no Grafana and no dashboards. The grafana application takes its dashboards
# from this chart, at the same version, in a release of its own.
grafana:
  enabled: false

# Cilium replaces kube-proxy, so there is none to scrape; this also leaves out KubeProxyDown, which
# would always fire.
kubeProxy:
  enabled: false

# Talos runs etcd on the host, outside Kubernetes, and talos/patches/controlplane/metrics.yaml has
# it serve its metrics over plain HTTP on 2381, the chart's default port and scheme. The API server
# runs on every control plane on the host's network, so the Service selects its pods to find the
# control planes' addresses.
kubeEtcd:
  service:
    selector:
      component: kube-apiserver
  serviceMonitor:
    # The endpoint asks for no credential, and over plain HTTP one would cross the network
    # readable.
    authorization: null

prometheus:
  prometheusSpec:
    # Every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and PrometheusRule in every namespace,
    # not only those of this release, so the other applications' monitors are scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # One replica: a second would scrape everything again into a store of its own, with nothing to
    # merge the two, and lose nothing a restart on another worker does not.
    replicas: 1
    # Two weeks covers looking back over a working week and the one before it. The size cap, which
    # counts the write-ahead log too, is 80% of the volume, as Prometheus's storage documentation
    # recommends, to leave room for compaction, which keeps old and new blocks on disk together
    # for a while; whichever limit comes first removes the oldest blocks. Prometheus counts a GB as
    # 1024 MB, so the cap is 16 GiB of the 20 GiB.
    retention: 14d
    retentionSize: 16GB
    # The restricted Pod Security level requires a non-root user and the runtime's seccomp profile
    # for the pod. The chart's defaults hold both, with the user and group the pod runs as; these
    # keep them whatever the defaults become. The operator gives each container it creates no
    # privilege escalation and no capabilities itself.
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
    # A claim on the cluster's default storage class.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  # Alertmanager's whole configuration (docs/kubernetes.md, Where alerts go). Every key the chart's
  # own configuration has is written out here, so that what the chart renders is this and nothing
  # of it comes from Helm merging the chart's values in; tests/alert-routes.bats compares the two,
  # and holds the keys at every position to the ones read against the operator, which parses the
  # configuration into its own types and stops at a key that is no field of them. No address is
  # here: each receiver reads its own from a file.
  config:
    global:
      resolve_timeout: 5m
    # The chart's four rules, as it ships them: a critical alert mutes the warning and info alerts
    # of its name and namespace, a warning the info alerts, the info inhibitor the info alerts of
    # its namespace, and any other alert the info inhibitor itself.
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      # What no route below takes ends here and is sent nowhere: the info alerts and the info
      # inhibitor, which the interfaces show. One notification for the alerts of one name in one
      # namespace, with the chart's own wait, interval and repeat.
      receiver: 'null'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # The Watchdog, which always fires, is the heartbeat: sent at once, flushed again every
        # minute, and sent again at the first flush that comes more than five minutes after the
        # last beat. First, and without continue, so that it never reaches notify whatever severity
        # it carries.
        - receiver: heartbeat
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: notify
          matchers:
            - severity =~ "critical|warning"
    receivers:
      # The chart's routes rely on a receiver of this name that holds no integration.
      - name: 'null'
      # A generic webhook each, whose address is the content of a file of the Secret
      # alert-destinations, mounted below; the alert-destinations application fills the Secret
      # from the secret store. Alertmanager reads the file at each notification.
      - name: notify
        webhook_configs:
          - url_file: /etc/alertmanager/destinations/notify-url
            send_resolved: true
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/destinations/heartbeat-url
            # The notification Alertmanager would send once the Watchdog stops arriving is no beat.
            send_resolved: false
    # The chart's glob, which matches the template files a release adds to the configuration's
    # Secret; this one adds none.
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    # One replica: a second would have to gossip with the first to send each notification once.
    # While the one is down nothing is sent, the heartbeat included, which is what its monitor
    # reports.
    replicas: 1
    # As Prometheus's.
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # The two addresses, as files. The volume is optional, so the pod starts while the Secret is
    # not there yet, with an empty directory, and the kubelet puts the files in once it is. Mounted
    # whole: a file mounted by subPath would not follow its Secret. Not spec.secrets, whose volume
    # the operator makes without optional: a pod without the Secret would wait for it, and no
    # Alertmanager would run until both addresses were in the store.
    volumes:
      - name: alert-destinations
        secret:
          secretName: alert-destinations
          optional: true
    volumeMounts:
      - name: alert-destinations
        mountPath: /etc/alertmanager/destinations
        readOnly: true
    # Silences and the notification log, which are small; a claim on the default storage class.
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
