---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafanadashboard-cilium-agent.yaml
  - grafanadashboard-cilium-bgp.yaml

configMapGenerator:
  - name: grafana-dashboard-cilium-agent
    files:
      - cilium-agent.json=dashboards/cilium-agent.json
  - name: grafana-dashboard-cilium-bgp
    files:
      - cilium-bgp.json=dashboards/cilium-bgp.json
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

configurations:
  - kustomizeconfig.yaml
