---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-monitoring-dashboard
  namespace: flux-system
spec:
  path: ./apps/base/monitoring/cilium-monitoring-dashboard/app
  targetNamespace: monitoring
  # The dashboards read what the monitor of cilium-monitoring scrapes and belong to it: the cluster
  # that does not scrape the agents does not run this either, and kubernetes-check refuses one that
  # lists this without it. It is its own application, in monitoring, because the Grafana operator
  # acts in monitoring only, and so that the agents' monitor and alerts never wait for the Grafana
  # operator. Its kind exists once grafana-operator is Ready.
  dependsOn:
    - name: cilium-monitoring
    - name: grafana-operator
  sourceRef:
    kind: ExternalArtifact
    name: cilium-monitoring-dashboard
