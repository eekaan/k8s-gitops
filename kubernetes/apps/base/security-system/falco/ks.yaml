---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco
  namespace: flux-system
spec:
  path: ./apps/base/security-system/falco/app
  targetNamespace: security-system
  # The chart makes a ServiceMonitor and the application a PrometheusRule, kinds that exist once
  # prometheus-operator-crds is Ready. Its CiliumNetworkPolicy is a kind Cilium's operator defines.
  dependsOn:
    - name: prometheus-operator-crds
    - name: cilium
  # Ready only once the release is installed, so a failed install shows on this Kustomization.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: falco
