---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  path: ./apps/base/cnpg-system/plugin-barman-cloud/app
  targetNamespace: cnpg-system
  # The plugin serves the operator, which must run for the plugin's Service to be found, and its
  # issuer and two certificates are of cert-manager's kinds, which cert-manager's webhook admits.
  dependsOn:
    - name: cert-manager
    - name: cloudnative-pg
  # Ready only once the release is installed and the plugin's pods are ready, which they are not
  # before the Secrets of its two certificates exist, as they mount them, so an application that
  # names this one in dependsOn finds the ObjectStore definition in place and a plugin that serves,
  # which every database pod that archives needs. kstatus also reads the condition Ready of a kind it
  # has no rule for, such as cert-manager's, so a certificate that reports it False, as one being
  # reissued for another issuer does once cert-manager has marked it and until it is, holds this back
  # too.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: plugin-barman-cloud
