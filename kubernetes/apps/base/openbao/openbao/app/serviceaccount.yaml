---
# The account an operator logs in to OpenBao as, through the role operator (initialize.json):
# `just bao-put` and `just bao-recovery` mint a ten-minute token for it through the Kubernetes API,
# which needs the right to create serviceaccounts/token for it in this namespace. No pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-operator
automountServiceAccountToken: false
