---
# The account an operator logs in to OpenBao as, through the role operator (initialize.json):
# `just bao-put`, `just bao-recovery` and `just bao-root` mint a ten-minute token for it through the
# Kubernetes API, which needs the right to create serviceaccounts/token for it in this namespace. No
# pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-operator
automountServiceAccountToken: false
---
# The account the job that takes snapshots of OpenBao's raft storage logs in as, through the role
# snapshot, which may take a snapshot and nothing else. Only that job's pod
# (apps/base/openbao/openbao-snapshots) runs as it, with a token projected for OpenBao's audience, so
# the account has no right in the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
automountServiceAccountToken: false
