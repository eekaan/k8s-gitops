---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# The cluster's S3 key, the one the volume backups use, read from the secret store's key volsync:
# only its two properties, so the restic master password never reaches this job. The key reaches
# every bucket of the project, the OpenBao bucket among them (docs/infrastructure.md), so no further
# step seeds it: just bao-seed-volsync has written it already.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshots-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshots-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: volsync
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: volsync
        property: AWS_SECRET_ACCESS_KEY
