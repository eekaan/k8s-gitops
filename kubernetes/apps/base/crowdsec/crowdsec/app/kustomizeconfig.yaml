---
# Lets kustomize write each generated ConfigMap's hashed name where the HelmRelease names it: the
# values it reads, and the acquisition it mounts into the agent, so a change to either produces a
# new ConfigMap and a new release.
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/valuesFrom/name
        kind: HelmRelease
      - path: spec/values/agent/extraVolumes/configMap/name
        kind: HelmRelease
