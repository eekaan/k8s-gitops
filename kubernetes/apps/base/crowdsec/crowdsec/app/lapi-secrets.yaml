---
# The two secrets the local API and its agents share, made once in the cluster and kept by no
# person and no file: the key the local API signs its sessions with, which the chart requires to be
# longer than 64 characters (72 hexadecimal digits here), and the token an agent presents to
# register itself with the local API, longer than 48 (56). Nothing outside the cluster needs either,
# and both are read only through the cluster's API, so new ones, should the Secret be made again,
# cost a restart of the local API and the agent, whose every new pod registers again under its own
# name.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-lapi-secret
spec:
  length: 36
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - csLapiSecret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-registration-token
spec:
  length: 28
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - registrationToken
---
# Writes both into the Secret crowdsec-lapi-secrets, which the release reads by name
# (secrets.externalSecret), once, when the ExternalSecret is first synced: with refreshPolicy
# CreatedOnce the operator does not sync it again, so neither changes under a running pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi-secrets
spec:
  refreshPolicy: CreatedOnce
  target:
    name: crowdsec-lapi-secrets
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-lapi-secret
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-registration-token
