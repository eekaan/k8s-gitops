---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
# The agent's account, which the chart does not make: the pod runs as it, so that the Role in the
# proxies' namespace (crowdsec-gateway-logs) names it and no other pod of the namespace gets the
# read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-agent
