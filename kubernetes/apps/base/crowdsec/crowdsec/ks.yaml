---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: flux-system
  labels:
    # The local API's two claims are made and attached before it starts, and the agent waits for
    # the local API, so the first rollout takes longer than the default.
    k8s-gitops/timeout: long
spec:
  path: ./apps/base/crowdsec/crowdsec/app
  targetNamespace: crowdsec
  # The release's two ServiceMonitors and the alert are of the Prometheus Operator's kinds; the
  # secrets the local API and the agents share are made by External Secrets' generators; the claims
  # come from LINSTOR's default class; the policies are of the kind Cilium's operator defines; and
  # the agent reads the proxies' pods only once the Kustomization that grants it the read is
  # applied, which waits for the public Gateway.
  dependsOn:
    - name: cilium
    - name: crowdsec-gateway-logs
    - name: external-secrets
    - name: linstor-cluster
    - name: prometheus-operator-crds
  # Ready once the release is, which is once the local API answers its health endpoint and the
  # agent its metrics, with the agent registered.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: crowdsec
