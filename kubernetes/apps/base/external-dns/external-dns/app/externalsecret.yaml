---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The DNS provider's API token, from the key api-token of cert-manager/cloudflare in the store, the
# entry the ACME issuers' ExternalSecret cloudflare-api-token also reads into cert-manager's
# namespace: one token scoped to DNS edit and zone read on the cluster's one zone, which an operator
# writes with `just bao-put cert-manager/cloudflare api-token`. Its Secrets are in those two
# namespaces and in no other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare
        property: api-token
