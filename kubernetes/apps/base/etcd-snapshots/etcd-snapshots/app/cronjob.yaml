---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
# An etcd snapshot every six hours, taken through the Talos API with a role that permits the
# snapshot and etcd's read-only status calls and changes nothing on a node, encrypted to the Talos
# age key's recipient before it leaves the pod, and uploaded under the name scripts/lib/snapshot.sh
# gives the operator's own, so just cluster-snapshots lists it and just cluster-restore latest picks
# the newest of either. docs/cluster.md, Scheduled etcd snapshots.
#
# The pod runs four steps in turn, each in the one image that has its tool, so no image is built
# here and the plain snapshot is in reach of the first three only:
#   fetch-age  age, the pinned release's, checked against its SHA-256: no public image carries it;
#   snapshot   talosctl, the cluster's Talos version, writes the snapshot into the memory-backed
#              volume "plain", with the talosconfig Talos made for os:etcd:backup;
#   encrypt    age encrypts it into "out" and removes the plain file;
#   upload     rclone sends the one file of "out" to the etcd bucket with the cluster's S3 key, which
#              no earlier step holds, and keeps the newest KEEP_SNAPSHOTS.
# The pod has no Kubernetes token and no toleration: it runs on a worker, which the control planes'
# firewall admits to the Talos API as a node (ADR 0017).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshots
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch-age
              image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: ["/bin/sh", "/scripts/fetch-age.sh"]
              env:
                # The age pin of mise.toml, which tests/etcd-snapshots.bats holds this to. The
                # checksums are those of the release's linux archives; .renovate/by-hand.tsv says
                # how they follow the version.
                - name: AGE_VERSION
                  value: "1.3.2"
                - name: AGE_SHA256_AMD64
                  value: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
                - name: AGE_SHA256_ARM64
                  value: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
                - name: TOOLS_DIR
                  value: /tools
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext: &container-security
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
            - name: snapshot
              # The image's tag is the cluster's Talos version, versions.yaml's talos, which
              # tests/etcd-snapshots.bats holds it to; the Talos group of Renovate moves them together.
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              # The talosconfig Talos made names the Service talos.default as its endpoint, which
              # reaches a control plane's Talos API; the node it asks is that one itself.
              args:
                - --talosconfig=/var/run/secrets/talos.dev/config
                - --nodes=127.0.0.1
                - etcd
                - snapshot
                - /plain/etcd.db
              env:
                # talosctl keeps its client keys under HOME, which the root filesystem, read-only,
                # does not offer.
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1536Mi
              securityContext: *container-security
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: plain
                  mountPath: /plain
                - name: tmp
                  mountPath: /tmp
            - name: encrypt
              image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: ["/bin/sh", "/scripts/encrypt.sh"]
              env:
                - name: PLAIN_SNAPSHOT
                  value: /plain/etcd.db
                - name: OUT_DIR
                  value: /out
                - name: AGE
                  value: /tools/age/age
                - name: AGE_RECIPIENT
                  value: ${ETCD_SNAPSHOT_AGE_RECIPIENT}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext: *container-security
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: plain
                  mountPath: /plain
                - name: out
                  mountPath: /out
          containers:
            - name: upload
              image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - name: OUT_DIR
                  value: /out
                - name: SNAPSHOT_BUCKET
                  value: ${BACKUP_BUCKET_PREFIX}-etcd
                - name: SNAPSHOT_CLUSTER
                  value: ${ETCD_SNAPSHOT_CLUSTER}
                # Two weeks of snapshots, every six hours. The job holds the right to delete: the
                # bucket's lifecycle rules are not set by any stack, and the cluster's S3 key
                # reaches every object of the project in any case (docs/cluster.md).
                - name: KEEP_SNAPSHOTS
                  value: "56"
                - name: HOME
                  value: /tmp
                # rclone's store, in its environment as the operator's recipes give it theirs:
                # the object storage of the project, any S3-compatible provider.
                - name: RCLONE_CONFIG
                  value: /dev/null
                - name: RCLONE_CONFIG_STORE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_STORE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_STORE_ENV_AUTH
                  value: "false"
                - name: RCLONE_CONFIG_STORE_ENDPOINT
                  value: ${S3_ENDPOINT}
                - name: RCLONE_CONFIG_STORE_REGION
                  value: ${S3_REGION}
                - name: RCLONE_CONFIG_STORE_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-snapshots-s3
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-snapshots-s3
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext: *container-security
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: out
                  mountPath: /out
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: etcd-snapshots-scripts
            - name: talos-secrets
              secret:
                secretName: etcd-snapshots-talos
            # The plain snapshot lives here and nowhere else: memory-backed, so it never reaches a
            # disk, and sized, so a snapshot that outgrows it fails the run instead of the node.
            - name: plain
              emptyDir:
                medium: Memory
                sizeLimit: 1Gi
            - name: out
              emptyDir:
                sizeLimit: 1Gi
            - name: tools
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
