---
# Asks Talos for a Secret of the same name that holds a talosconfig for the Talos API with the role
# os:etcd:backup, which permits taking an etcd snapshot and reading etcd's status, member list and
# alarm list, and nothing that changes a node or reads its configuration. Talos serves this kind on
# the control planes once a KubeTalosAPIAccessConfig document is applied
# (talos/patches/controlplane/talos-api-access.yaml), and makes the Secret only in a namespace that
# document names. On a cluster whose control planes lack the document the kind does not exist, so
# Flux's dry run of this application's objects fails on it and applies none of them: no CronJob, no
# PrometheusRule and no alert exist, and the only sign is the Kustomization etcd-snapshots not
# Ready.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshots-talos
spec:
  roles:
    - os:etcd:backup
