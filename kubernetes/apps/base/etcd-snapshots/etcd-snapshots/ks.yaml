---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-snapshots
  namespace: flux-system
spec:
  path: ./apps/base/etcd-snapshots/etcd-snapshots/app
  targetNamespace: etcd-snapshots
  # External Secrets' definitions, for the ExternalSecret that reads the S3 key, and the store that
  # key is read from; the monitoring definitions, for the PrometheusRule.
  dependsOn:
    - name: external-secrets
    - name: openbao-store
    - name: prometheus-operator-crds
  postBuild:
    substitute:
      # The cluster the snapshots are of, the directory name of kubernetes/clusters/<cluster> and
      # talos/<cluster>, under which the operator's recipes list them. A second cluster that runs
      # this application sets both values from its overlay.
      ETCD_SNAPSHOT_CLUSTER: lab-sto2
      # The public half of the Talos age key, talos/.sops.yaml's recipient, which the operator's
      # recipes encrypt snapshots to. tests/etcd-snapshots.bats fails when the two differ, so the
      # recipient that just cluster-age-key writes there is written here too.
      ETCD_SNAPSHOT_AGE_RECIPIENT: age1pklkf3zmxckt2xv2anwljpylrlkzkzv2tuwn2eurcht8jhu36ququnulxj
  sourceRef:
    kind: ExternalArtifact
    name: etcd-snapshots
