---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
  valuesFrom:
    - kind: ConfigMap
      name: kyverno-values
  postRenderers:
    - kustomize:
        patches:
          # Deleting a definition deletes every policy and report of its kind, so Helm leaves each
          # definition in place when the release is uninstalled, as it is when this application
          # leaves the tree. A merge sets the annotation once, whether or not the chart wrote it.
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: _
                annotations:
                  helm.sh/resource-policy: keep
