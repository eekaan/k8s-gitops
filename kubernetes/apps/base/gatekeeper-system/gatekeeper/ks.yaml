---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  path: ./apps/base/gatekeeper-system/gatekeeper/app
  targetNamespace: gatekeeper-system
  # The application makes a PodMonitor and a PrometheusRule, kinds that exist once
  # prometheus-operator-crds is Ready. Nothing else depends on this application, and the cluster
  # runs as well without it: its webhooks fail open.
  dependsOn:
    - name: prometheus-operator-crds
  # Ready only once the release is installed and its pods are ready, so the rules, which are of
  # kinds its release defines, are applied to a cluster that has them.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: gatekeeper
