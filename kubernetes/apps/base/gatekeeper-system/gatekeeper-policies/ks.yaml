---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatekeeper-policies
  namespace: flux-system
spec:
  path: ./apps/base/gatekeeper-system/gatekeeper-policies/app
  # The rules are cluster-scoped, so no object of theirs lands in a namespace.
  targetNamespace: gatekeeper-system
  # A constraint's kind exists only once Gatekeeper has made it from its template, so this waits
  # for gatekeeper-templates, which is Ready once every template's kind is served: Flux's dry run of
  # a constraint of a kind that does not exist fails the whole Kustomization. A template and its
  # constraint added in one change can cost one failed attempt and its retry (docs/kubernetes.md,
  # Admission policy).
  dependsOn:
    - name: gatekeeper-templates
  sourceRef:
    kind: ExternalArtifact
    name: gatekeeper-policies
