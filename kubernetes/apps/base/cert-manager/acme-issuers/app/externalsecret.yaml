---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The DNS provider's API token, from the key cert-manager/cloudflare of the secret store, where an
# operator writes it with `just bao-put cert-manager/cloudflare api-token`, into the Secret the
# issuers' DNS-01 solvers name. A ClusterIssuer reads its Secrets from cert-manager's namespace, so
# the Secret is made here and no other namespace holds it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare
        property: api-token
