---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
# What a Certificate of any namespace names to be signed by the cluster's own authority. It reads the
# authority's Secret from cert-manager's namespace, where a ClusterIssuer looks for its secrets. The
# public certificate of ADR 0006 comes from an issuer of its own once its story lands, and the
# Certificates that name this one change their issuerRef.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-ca
spec:
  ca:
    secretName: cluster-ca
