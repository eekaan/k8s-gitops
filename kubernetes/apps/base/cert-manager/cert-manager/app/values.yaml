---
# Values for the cert-manager chart, read by the HelmRelease through a ConfigMap generated without
# substitution. Keys not set here keep the chart's defaults. The replicas, disruption budgets,
# priority class and resource requests follow the publisher's best-practice guidance for
# production, sized for three workers.

crds:
  # The release installs and upgrades cert-manager's resource definitions, as its publisher
  # recommends under Flux, so they always match the controller that serves them.
  enabled: true
  # Deleting a definition deletes every certificate and issuer of its kind, so Helm leaves the
  # definitions in place when the release is uninstalled, as it is when this application leaves
  # the tree.
  keep: true

global:
  # The controller's and the CA injector's leader election leases live in cert-manager's own
  # namespace instead of kube-system, so cert-manager needs no permission there.
  leaderElection:
    namespace: cert-manager
  # While the webhook is down, nothing can create or change a certificate or an issuer.
  priorityClassName: system-cluster-critical

config:
  # Certificates for the listeners of Gateway API Gateways, and HTTPRoutes for HTTP-01 challenges.
  # cert-manager looks for the Gateway API definitions once, when it starts; ks.yaml waits for them.
  gatewayAPI:
    enabled: true

# The DNS-01 self-check asks whether a challenge's TXT record is visible before cert-manager asks
# the CA to look. It asks the zone's own authoritative nameservers, never a recursive resolver, so a
# negative answer that a resolver cached (RFC 2308) for the zone's SOA time cannot hold a challenge
# whose record is already published. Each is asked over UDP port 53, and again over TCP port 53 when
# the UDP answer is truncated or does not arrive before the query times out. That is the
# controller's default; the nameservers-only setting, which sends the TXT lookup to the resolver
# listed below, stays off, as an argument and in the controller's config.
# The resolver below is asked for the zone, its nameservers and whether the challenge's name is a
# CNAME: answers a cache cannot get wrong, except in a zone whose wildcard record is a CNAME
# (docs/kubernetes.md, cert-manager). It is a DNS-over-HTTPS endpoint by name, so the tree holds no
# address and the zone is not looked up through the cluster's own resolver, which may not see it. A
# second would be asked only when the first fails to answer, and would be one more destination for
# the controller's egress to allow.
dns01RecursiveNameservers: https://cloudflare-dns.com/dns-query

# Each component keeps a pod through a drain: a disruption budget that keeps one available, which
# the chart sets when the budget gives no number, and more replicas than that, so a drain can still
# evict one. The spread over nodes is a preference, never a reason to leave a pod unscheduled.
# The chart sets no resources; the requests are the ones its values file gives as an example, and
# no limits are set, as memory use grows with the number of certificates and secrets it watches.

# The controller elects a leader; the second replica stands by.
replicaCount: 2
podDisruptionBudget:
  enabled: true
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cert-manager
        app.kubernetes.io/component: controller
resources:
  requests:
    cpu: 10m
    memory: 32Mi

webhook:
  # Every replica answers the API server, so one per worker.
  replicaCount: 3
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: webhook
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  # The CA injector elects a leader; the second replica stands by.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: cainjector
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# The controller's metrics, which the alerts on certificates read (docs/kubernetes.md, Alerts).
prometheus:
  servicemonitor:
    enabled: true
  podmonitor:
    enabled: false
