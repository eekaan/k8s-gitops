---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: piraeus-datastore
  annotations:
    # Removing the namespace from the tree must not delete everything in it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # LINSTOR's satellites run privileged, in the host's IPC namespace, with the host's /dev and
    # other host paths, and so do the CSI node plugin, the NFS server and the HA controller the
    # operator runs beside them; only the privileged level admits them. pod-security-exceptions.yaml
    # lists them, and the operator's own pod, the only one here the render holds, at baseline, and
    # the check that reads it (docs/kubernetes.md, Pod Security) requires audit and warn at
    # restricted at the cluster's Kubernetes minor, which records and reports any pod the operator
    # creates that fails restricted.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
