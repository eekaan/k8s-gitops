---
# The storage cluster: the operator runs from it the LINSTOR controller, the CSI driver, the HA
# controller and one satellite per node it selects, each configured by the
# LinstorSatelliteConfigurations beside it.
apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Workers only: their data volumes hold LINSTOR's storage and the control planes have none. Talos
  # labels every control plane with node-role.kubernetes.io/control-plane and no worker, so this
  # takes every worker by its role, never by its name, a worker OpenTofu adds later included. A pod
  # that uses a LINSTOR volume runs only on a node selected here.
  nodeAffinity:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  # LINSTOR's API takes only clients presenting a certificate the API's authority signed (tls.yaml):
  # the controller serves it over HTTPS on 3371, the port secure-api, and requires a client
  # certificate, and the operator asks the issuer below for the controller's certificate and for a
  # client certificate for itself, which the CLI in the controller's pod also uses, for the CSI
  # controller, the CSI node plugin, the affinity controller and the NFS server, each in a Secret of
  # its default name, with the issuer's ca.crt beside it as the authority they trust. The port api,
  # 3370, keeps serving the controller's metrics and health check over plain HTTP, which the scrape
  # and the liveness probe read, and answers a request for the API with a redirect to 3371.
  apiTLS:
    certManager:
      group: cert-manager.io
      kind: Issuer
      name: linstor-api-ca
  # The controller commands each satellite over TLS on 3367, and each side presents a certificate of
  # the internal authority (tls.yaml) and takes only one that authority signed: the operator asks the
  # issuer below for a client certificate for the controller, in the Secret
  # linstor-controller-internal-tls, and, through the configuration internal-tls, for a server
  # certificate for each satellite, in the Secret <node>-tls, each with the issuer's ca.crt beside it
  # as the authority it trusts. A satellite takes a connection only from a holder of the internal
  # authority's certificate.
  internalTLS:
    certManager:
      group: cert-manager.io
      kind: Issuer
      name: linstor-internal-ca
  # The controllers' pods run as the restricted Pod Security level requires: a non-root user, the
  # runtime's seccomp profile, and no privilege escalation and no capabilities in each container.
  # The operator applies each podTemplate as a patch to its own template, which drops every
  # capability but sets none of the rest, so each names every container of its template at the
  # operator's version. The images run as root unless told otherwise; the controller's publisher
  # builds its image to run under an arbitrary user with group 1000, and the affinity controller's
  # image runs as nobody. The satellites, the CSI node plugin, the HA controller and the NFS server
  # run privileged instead (pod-security-exceptions.yaml). The container names are those of the
  # operator's templates at the version below; tests/pod-security.bats fails when the piraeus-operator
  # application runs another, until its templates are read again and this record moves with them.
  # piraeus-operator-templates: v2.12.1
  controller:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: run-migration
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          - name: linstor-controller
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
  csiController:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: linstor-wait-api-online
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          - name: linstor-csi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: csi-attacher
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: csi-livenessprobe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: csi-provisioner
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: csi-snapshotter
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: csi-resizer
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
  affinityController:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: linstor-affinity-controller
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
