---
# The satellite on Talos, as the operator's Talos guide prescribes it
# (https://github.com/piraeusdatastore/piraeus-operator/blob/v2/docs/how-to/talos.md).
# Talos's LVM configuration turns off LVM's metadata backups and /etc/lvm is read-only, so this
# configuration takes the host's place for the satellite and keeps backups and archives, which the
# satellite writes under /var/etc/lvm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: talos-lvm-config
data:
  lvm.conf: |
    backup {
      backup = 1
      archive = 1
    }
---
# Applies to every satellite. Talos has no systemd and lets no workload load a kernel module: the
# node's machine configuration loads DRBD, its TCP transport and the device-mapper targets
# (talos/patches/all/kernel-modules.yaml), so the module loader and the systemd shutdown guard go,
# with the host paths only they use.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-loader-override
spec:
  podTemplate:
    spec:
      initContainers:
        - name: drbd-shutdown-guard
          $patch: delete
        - name: drbd-module-loader
          $patch: delete
      volumes:
        - name: run-systemd-system
          $patch: delete
        - name: run-drbd-shutdown-guard
          $patch: delete
        - name: systemd-bus-socket
          $patch: delete
        - name: lib-modules
          $patch: delete
        - name: usr-src
          $patch: delete
        - name: etc-lvm
          hostPath: null
          configMap:
            name: talos-lvm-config
        - name: etc-lvm-backup
          hostPath:
            path: /var/etc/lvm/backup
            type: DirectoryOrCreate
        - name: etc-lvm-archive
          hostPath:
            path: /var/etc/lvm/archive
            type: DirectoryOrCreate
