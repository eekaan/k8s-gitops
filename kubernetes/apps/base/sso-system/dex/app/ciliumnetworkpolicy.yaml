---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What dex lets through, on top of the namespace's default deny: the public Gateway's proxies bring
# a person's browser to the issuer, oauth2-proxy redeems the sign-in code and reads the keys inside
# the cluster, and the kubelet probes it; dex reaches the API server, where its state is, and the
# cluster's resolver. GitHub, outside the cluster, is the next policy's. No monitor of the tree
# scrapes its telemetry port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dex
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex
      app.kubernetes.io/instance: dex
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The routed backend: only the pods Envoy Gateway runs for the public Gateway, selected by their
    # labels and not by their namespace. The route reaches dex through its Service's 5556.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: public
            gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
    # oauth2-proxy, which redeems the sign-in code and reads dex's keys through dex's Service.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": sso-system
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
    # The kubelet's probes, on the telemetry port.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5558"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The API server, where dex's storage keeps its state as objects of its own group and, at start,
    # makes their definitions. A Service's address is translated to the control plane's before
    # policy applies, so 6443 is the port that counts.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# GitHub, where dex's connector exchanges the sign-in code (github.com) and reads the account and its
# addresses (api.github.com). A DNS name rule would need a layer-7 DNS rule beside it, which the
# tree keeps out (ADR 0019), so the policy allows the world on 443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dex-github
  annotations:
    k8s-gitops/network-policy-reason: dex's GitHub connector reaches github.com and api.github.com outside the cluster, which a rule without a layer-7 DNS rule cannot name; dex reaches them on 443 only
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex
      app.kubernetes.io/instance: dex
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
