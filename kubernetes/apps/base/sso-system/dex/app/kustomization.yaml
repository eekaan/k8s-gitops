---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ciliumnetworkpolicy.yaml
  - client-secret.yaml
  - github-client.yaml
  - helmrelease.yaml
  - httproute.yaml
  - ocirepository.yaml
  - probe.yaml

configMapGenerator:
  - name: dex-values
    files:
      - values.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

configurations:
  - kustomizeconfig.yaml
