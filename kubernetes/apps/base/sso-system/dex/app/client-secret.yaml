---
# The secret dex and oauth2-proxy share: oauth2-proxy's client secret at dex. Nobody needs to know
# it, so no person makes it: External Secrets generates it here, 32 characters hex-encoded into 64
# hexadecimal digits, and writes it into the Secret dex-oauth2-proxy-client once. Both applications
# read it from that Secret, which nothing else keeps; it is read only through the cluster's API.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dex-oauth2-proxy-client
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - client-secret
---
# With refreshPolicy CreatedOnce the operator does not sync it after the first time, so the secret
# never changes under running pods, which read it when they start. A Secret that is deleted is made
# again with a new value, which neither application reads until it is restarted by hand
# (docs/kubernetes.md, Sign-in).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-oauth2-proxy-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: dex-oauth2-proxy-client
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dex-oauth2-proxy-client
