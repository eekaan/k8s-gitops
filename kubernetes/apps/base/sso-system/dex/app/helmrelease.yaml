---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dex
  # The values, which Flux does not substitute: the settings that depend on the cluster's domain
  # are in spec.values, which it does. A list in values replaces the chart's whole, so the
  # connector and the static client, which name the domain, are here in full.
  valuesFrom:
    - kind: ConfigMap
      name: dex-values
  values:
    config:
      issuer: https://dex.${CLUSTER_DOMAIN}
      connectors:
        # GitHub is the only source of identity. dex expands ${NAME} in a connector's settings from
        # its environment, so the client's ID and secret are the pods' variables, which come from
        # the Secret dex-github; $$ reaches dex as a single $, past Flux's substitution.
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $${DEX_GITHUB_CLIENT_ID}
            clientSecret: $${DEX_GITHUB_CLIENT_SECRET}
            redirectURI: https://dex.${CLUSTER_DOMAIN}/callback
      staticClients:
        # oauth2-proxy's client. Its secret is read from the variable named in secretEnv; its one
        # redirect URI is the callback on the sign-in host, whichever host a person starts from.
        - id: oauth2-proxy
          name: oauth2-proxy
          secretEnv: OAUTH2_PROXY_CLIENT_SECRET
          redirectURIs:
            - https://auth.${CLUSTER_DOMAIN}/oauth2/callback
