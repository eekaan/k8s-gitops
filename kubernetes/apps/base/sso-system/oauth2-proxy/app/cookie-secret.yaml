---
# The secret oauth2-proxy's session cookies are encrypted and signed with. Nobody needs to know it,
# so no person makes it: External Secrets generates it here and writes it into the Secret
# oauth2-proxy-cookie once. 16 characters hex-encoded are 32 hexadecimal digits, which oauth2-proxy
# base64-decodes to 24 bytes, a valid AES-192 key; a size that decodes to anything but 16, 24 or 32
# bytes is not a valid cookie secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: oauth2-proxy-cookie
spec:
  length: 16
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - cookie-secret
---
# With refreshPolicy CreatedOnce the operator does not sync it after the first time, so the secret
# never changes under running pods. A Secret that is deleted is made again with a new value, which
# reaches a pod only when it restarts: until both replicas have, they disagree on the key and a
# session one replica made is refused by the other. Once both have, every session has ended.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
spec:
  refreshPolicy: CreatedOnce
  target:
    name: oauth2-proxy-cookie
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oauth2-proxy-cookie
