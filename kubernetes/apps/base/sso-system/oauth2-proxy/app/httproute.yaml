---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# The sign-in host: auth under the cluster's domain, on the public Gateway's https listener, which
# this namespace reaches through its k8s-gitops/gateway label. The one callback dex sends a person
# back to is on it, and a person can start a sign-in here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - auth.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
