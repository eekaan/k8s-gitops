---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ciliumnetworkpolicy.yaml
  - deployment-master.yaml
  - deployment-worker.yaml
  - service.yaml

# The locustfile, under a name that carries the hash of its content, so a change gives both
# Deployments a new ConfigMap and restarts every pod. Flux's substitution leaves it alone: it is
# Python, not a manifest.
configMapGenerator:
  - name: locust-locustfile
    files:
      - locustfile.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
