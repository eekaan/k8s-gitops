---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Locust's workers: each connects to the master's Service on 5557 and runs the users the master
# hands it, against the host the master names with them. A worker listens on nothing, so it has no
# port and no probe; each is one process that uses at most about one core. The image is the
# master's, by the same reference: a worker of another version is only warned of
# (docs/kubernetes.md, Locust).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  labels:
    app.kubernetes.io/name: locust
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: locust
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: locust
        app.kubernetes.io/component: worker
    spec:
      # Locust calls no API.
      automountServiceAccountToken: false
      # No Service hands the pod variables, which Locust would read as its options (the master's
      # Deployment says why).
      enableServiceLinks: false
      securityContext:
        # The image's user is the name locust, uid and gid 1000. The kubelet cannot hold a name to
        # runAsNonRoot and refuses to start the container, so the numbers are given.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: locust
          image: docker.io/locustio/locust:2.47.0@sha256:90fdf5b9632e67bb556d17784095652871be68318c5074731d911d4caaa42cc3
          # No --host: the master hands its host to each worker with every test it starts.
          args:
            - --worker
            - --locustfile=/mnt/locust/locustfile.py
            - --master-host=locust-master
            - --master-port=5557
          # Measured offline: about 62 MiB resident at its peak under the smoke test, and under a
          # twentieth of a core.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
              readOnly: true
      volumes:
        - name: locustfile
          configMap:
            name: locust-locustfile
