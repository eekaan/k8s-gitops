---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: locust
  annotations:
    # Removing the namespace from the tree must not delete everything in it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Locust's master and workers run as the image's user and group, 1000, as non-root with the
    # runtime's default seccomp profile, a read-only root filesystem, no capabilities and no
    # privilege escalation, which the restricted level requires.
    pod-security.kubernetes.io/enforce: restricted
    # Routes of this namespace may attach to the public Gateway's https listener: locust-route's,
    # Locust's interface behind the cluster's sign-in (docs/kubernetes.md, Locust).
    k8s-gitops/gateway: public
