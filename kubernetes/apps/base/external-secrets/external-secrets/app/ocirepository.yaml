---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
# The External Secrets chart from its publisher's public OCI registry, where its release workflow
# pushes every chart it also publishes to its classic Helm repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
spec:
  # The tag is pinned: a new chart arrives by a change to this file, which Flux applies at once.
  interval: 12h
  # The chart's packaged layer, which helm-controller reads as it is.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  ref:
    # renovate: datasource=docker depName=ghcr.io/external-secrets/charts/external-secrets
    tag: 2.15.0
  # Go regular expressions, kept to syntax POSIX extended expressions read the same way (no \d).
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/external-secrets/external-secrets/\.github/workflows/helm\.yml@refs/heads/main$'
