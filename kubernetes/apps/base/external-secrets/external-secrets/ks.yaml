---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  path: ./apps/base/external-secrets/external-secrets/app
  targetNamespace: external-secrets
  # Ready only once the release is installed, so an application that names this one in dependsOn
  # finds the operator's definitions and its webhook in place.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: external-secrets
