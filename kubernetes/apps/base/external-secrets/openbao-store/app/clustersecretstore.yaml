---
# The store every ExternalSecret names to read a runtime secret from OpenBao (ADR 0005): the key
# under the key-value mount secrets/, version 2, such as demo/hello for secrets/data/demo/hello.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # The active member, under a name its certificate holds.
      server: https://openbao-active.openbao.svc:8200
      path: secrets
      version: v2
      # OpenBao's own CA, which cert-manager keeps in the openbao namespace.
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-store
            namespace: external-secrets
            # The audience OpenBao's role checks, so the token is good for OpenBao and nothing else.
            audiences:
              - openbao
