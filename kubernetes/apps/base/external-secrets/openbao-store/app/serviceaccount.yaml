---
# The account the store logs in to OpenBao as: the operator mints a token for it, with OpenBao's
# audience, each time it logs in. Its only use is OpenBao's role external-secrets, which reads the
# key-value mount secrets/ and nothing else. No pod runs as it, and it holds no Kubernetes
# permission.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-store
automountServiceAccountToken: false
