---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/probe_v1.json
# Backstage's route, probed from inside the cluster by the blackbox exporter as hello's is
# (docs/kubernetes.md, Probes): the public Gateway's proxies' Service by its cluster name, over https,
# with the hostname as the parameter that sets the Host header and the name the TLS handshake
# verifies. The path is Backstage's readiness endpoint, a GET the route admits, which answers 200
# without a session once every plugin has started, each having migrated its schema in the
# database. The module takes a 200 only.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: backstage
spec:
  jobName: public-endpoints
  module: public_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-envoy-gateway-system-public-5ea56ca9.envoy-gateway-system.svc.cluster.local/.backstage/health/v1/readiness
      labels:
        hostname: backstage.${CLUSTER_DOMAIN}
      relabelingConfigs:
        - action: replace
          sourceLabels:
            - hostname
          targetLabel: __param_hostname
