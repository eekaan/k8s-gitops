---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: locust-route
  description: The HTTPRoute that serves Locust's interface at locust under the cluster's domain on the public Gateway, behind the cluster's sign-in, sending on its reads and only its own page's posts that start, stop and reset a test.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#locust
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/locust/locust-route
      title: Manifests
spec:
  type: route
  lifecycle: experimental
  owner: group:default/operators
  system: applications
  dependsOn:
    - component:default/blackbox-exporter
    - resource:default/gateway-public
    - component:default/locust
    - component:default/oauth2-proxy
