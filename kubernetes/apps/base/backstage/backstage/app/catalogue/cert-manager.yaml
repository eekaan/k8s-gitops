---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cert-manager
  description: Issues and renews the TLS certificates that applications and gateways ask for.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#cert-manager
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/runbooks/alerts.md#certmanagercertificatenotready
      title: Runbook
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/cert-manager/cert-manager
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: certificates
  dependsOn:
    - resource:default/gateway-api-crds
    - resource:default/prometheus-operator-crds
