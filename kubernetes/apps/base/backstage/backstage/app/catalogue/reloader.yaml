---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: reloader
  description: Restarts a workload annotated for it when a ConfigMap or Secret it uses changes.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#the-kube-system-baseline
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/kube-system/reloader
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: cluster-services
  dependsOn:
    - resource:default/prometheus-operator-crds
