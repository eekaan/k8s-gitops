  description: The CloudNativePG operator, which runs an application's PostgreSQL as a cluster of three instances.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#postgresql
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/cnpg-system/cloudnative-pg
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: databases
  dependsOn:
    - resource:default/prometheus-operator-crds
