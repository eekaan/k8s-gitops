---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: hello-secret
  description: The ExternalSecret that reads the demo's greeting from the secret store.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#how-an-application-gets-a-secret-out
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/demo/hello-secret
      title: Manifests
spec:
  type: secret
  lifecycle: experimental
  owner: group:default/operators
  system: demo
  dependsOn:
    - resource:default/openbao-store
