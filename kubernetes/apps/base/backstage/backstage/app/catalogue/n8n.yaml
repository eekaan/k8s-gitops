---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: n8n
  description: n8n, the workflow automation tool, with a PostgreSQL cluster and a backed-up volume.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#n8n
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/runbooks/volume-backups.md#restoring-a-claim-from-its-repository
      title: Runbook
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/ai-system/n8n
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: applications
  dependsOn:
    - component:default/blackbox-exporter
    - component:default/cloudnative-pg
    - component:default/external-secrets
    - resource:default/gateway-public
    - resource:default/linstor-cluster
    - resource:default/openbao-store
    - component:default/plugin-barman-cloud
    - resource:default/prometheus-operator-crds
    - component:default/volsync
