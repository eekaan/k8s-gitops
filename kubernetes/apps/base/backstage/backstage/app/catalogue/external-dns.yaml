---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: external-dns
  description: Publishes the DNS records of the public Gateway's routes.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#dns-records
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/runbooks/alerts.md#externaldnssyncstale
      title: Runbook
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/external-dns/external-dns
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: networking
  dependsOn:
    - resource:default/gateway-public
    - resource:default/openbao-store
    - resource:default/prometheus-operator-crds
