  description: The constraints, in dry-run, of Gatekeeper's three ConstraintTemplates, the same three rules as kyverno-policies.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#the-three-rules
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/gatekeeper-system/gatekeeper-policies
      title: Manifests
spec:
  type: policy
  lifecycle: production
  owner: group:default/operators
  system: admission-policy
  dependsOn:
    - resource:default/gatekeeper-templates
