# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: silence-operator-dashboard
  description: The Grafana dashboard for the silence operator.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#dashboards
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/monitoring/silence-operator-dashboard
      title: Manifests
spec:
  type: dashboard
  lifecycle: production
  owner: group:default/operators
  system: observability
  dependsOn:
    - component:default/grafana-operator
    - component:default/silence-operator
