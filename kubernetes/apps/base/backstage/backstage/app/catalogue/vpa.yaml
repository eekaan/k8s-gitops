---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vpa
  description: The Vertical Pod Autoscaler's recommender, which recommends requests from what pods use.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#vertical-pod-autoscaler
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/kube-system/vpa
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: cluster-services
  dependsOn:
    - component:default/metrics-server
    - resource:default/prometheus-operator-crds
