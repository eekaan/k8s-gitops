---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: grafana-operator
  description: The Grafana operator, which runs one Grafana from resources in the monitoring namespace.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#grafana
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/monitoring/grafana-operator
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: observability
  dependsOn:
    - resource:default/prometheus-operator-crds
