---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kromgo
  description: Serves a few numbers about the cluster as badges, each from one query to the cluster's Prometheus.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#status-badges
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/kromgo/kromgo
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: observability
  dependsOn:
    - component:default/cilium
    - resource:default/gateway-public
    - resource:default/prometheus-operator-crds
