---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: hello-route
  description: The HTTPRoute that gives the demo workload a name on the public Gateway.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#giving-an-application-a-public-hostname
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/demo/hello-route
      title: Manifests
spec:
  type: route
  lifecycle: experimental
  owner: group:default/operators
  system: demo
  dependsOn:
    - resource:default/gateway-public
    - component:default/hello
