---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: volsync
  description: VolSync, which backs a volume up to a restic repository and restores it from there.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#volume-backups
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/runbooks/volume-backups.md
      title: Runbook
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/volsync-system/volsync
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: storage
  dependsOn:
    - resource:default/prometheus-operator-crds
    - component:default/snapshot-controller
