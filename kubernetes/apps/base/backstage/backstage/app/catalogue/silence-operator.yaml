---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: silence-operator
  description: The silence operator, which turns each Silence object of the tree into a silence in the cluster's Alertmanager.
  links:
    - url: https://github.com/eekaan/k8s-gitops/blob/main/docs/kubernetes.md#silences
      title: Documentation
    - url: https://github.com/eekaan/k8s-gitops/tree/main/kubernetes/apps/base/monitoring/silence-operator
      title: Manifests
spec:
  type: service
  lifecycle: production
  owner: group:default/operators
  system: observability
  dependsOn:
    - resource:default/prometheus-operator-crds
