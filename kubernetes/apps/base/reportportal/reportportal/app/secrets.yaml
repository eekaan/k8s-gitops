---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
# The superadmin's first password: 16 characters of letters of both cases, digits and symbols,
# hex-encoded into 32 hexadecimal digits, as the login form takes at most 36 characters
# (PASSWORD_MAX_ALLOWED_LENGTH of service-ui). The api sets it on admin@reportportal.internal at each
# start until that account first signs in, and never after (docs/kubernetes.md, ReportPortal).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: reportportal-superadmin
spec:
  length: 16
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# Writes it into the Secret reportportal-superadmin once, when the ExternalSecret is first synced: with
# refreshPolicy CreatedOnce the operator does not sync it after that, so the password the owner reads
# is the one the api set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-superadmin
spec:
  refreshPolicy: CreatedOnce
  target:
    name: reportportal-superadmin
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: reportportal-superadmin
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
# RabbitMQ's default user's password and its Erlang cookie, a value each: 32 characters hex-encoded
# into 64 hexadecimal digits, which go into the api's and the jobs service's AMQP and management
# URLs as they are. Nothing outside the cluster needs them and nothing keeps them but the Secret below
# and RabbitMQ's volume.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: reportportal-rabbitmq
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
    - erlangCookie
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# The Secret reportportal-rabbitmq, written once: RabbitMQ's chart reads password and erlang-cookie
# (auth.existingSecret), and the api and the jobs service the same password under rabbitmq-password,
# the key the chart names for them (msgbroker.secretName). With refreshPolicy CreatedOnce it never
# changes under RabbitMQ, which keeps the user's password in its own data from its first start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-rabbitmq
spec:
  refreshPolicy: CreatedOnce
  target:
    name: reportportal-rabbitmq
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        password: "{{ .password }}"
        rabbitmq-password: "{{ .password }}"
        erlang-cookie: "{{ .erlangCookie }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: reportportal-rabbitmq
