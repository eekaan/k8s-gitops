---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reportportal-volsync-movers
  namespace: flux-system
spec:
  path: ./apps/base/reportportal/reportportal-volsync-movers/app
  targetNamespace: reportportal
  # The policies are of Cilium's kind, which its operator defines.
  dependsOn:
    - name: cilium
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: reportportal-volsync-movers
