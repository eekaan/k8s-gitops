---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reportportal-route
  namespace: flux-system
spec:
  path: ./apps/base/reportportal/reportportal-route/app
  targetNamespace: reportportal
  # The component adds the policy that asks oauth2-proxy and the route for the sign-in paths.
  components:
    - ../../../../../components/sso
  postBuild:
    substitute:
      SSO_ROUTE: reportportal
      SSO_HOSTNAME: reportportal
  # The route names the public Gateway and ReportPortal's Services, and the policy names
  # oauth2-proxy's Service, which the grant in its namespace lets this one reach. The route is
  # applied only once ReportPortal and oauth2-proxy are Ready, so no request reaches it before the
  # sign-in can answer for it. Its Probe is answered by the blackbox exporter.
  dependsOn:
    - name: reportportal
    - name: gateway-public
    - name: oauth2-proxy
    - name: blackbox-exporter
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: reportportal-route
