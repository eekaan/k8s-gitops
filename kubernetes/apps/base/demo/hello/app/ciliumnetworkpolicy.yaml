---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What hello lets through, on top of the namespace's default deny: connections from the public
# Gateway's proxies, from Locust's workers and from Robot Framework's runner to the port its Service
# targets, and the kubelet's readiness probe. hello opens no connection of its own.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hello
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hello
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The routed backend: only the pods Envoy Gateway runs for the public Gateway, selected by their
    # labels and not by their namespace, whose controller and certificate job are no proxies. The
    # route reaches hello through the Service, whose port 80 targets the container's 8080.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: public
            gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The kubelet's readiness probe, which arrives from the node the pod runs on.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Locust's workers, which put load on hello from inside the cluster through its Service
    # (docs/kubernetes.md, Locust): by the workers' labels in locust, so its master, which sends
    # nothing, and any other pod there are not admitted. While no worker runs it admits nothing.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": locust
            app.kubernetes.io/name: locust
            app.kubernetes.io/component: worker
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Robot Framework's runner, whose suites check hello over HTTP and in a browser from inside the
    # cluster through its Service (docs/kubernetes.md, Robot Framework): by the runner's labels in
    # robot, so the report server and any other pod there are not admitted. While no run runs it
    # admits nothing.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": robot
            app.kubernetes.io/name: robot
            app.kubernetes.io/component: runner
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
