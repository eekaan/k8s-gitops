---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-route
  namespace: flux-system
spec:
  path: ./apps/base/demo/hello-route/app
  targetNamespace: demo
  # The component puts the route behind the web application firewall, in blocking mode: nothing
  # real is behind the demo, so a false positive costs nothing here.
  components:
    - ../../../../../components/waf
  postBuild:
    substitute:
      WAF_ROUTE: hello
      WAF_MODE: "On"
  # The route names the public Gateway and the hello Service; the firewall's policy is of a kind
  # envoy-gateway-crds defines, which gateway-public waits for through envoy-gateway. A cluster
  # without the Gateway cannot enable it.
  dependsOn:
    - name: gateway-public
    - name: hello
  wait: true
  # Ready only once the controller has accepted the firewall's policy at its generation: the policy
  # fails open, so a module the leading controller replica could not fetch shows here, and not only
  # as a route served without its firewall; the other ways it fails open show only in the logs
  # (components/waf).
  healthCheckExprs:
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyExtensionPolicy
      current: >-
        has(status.ancestors) && size(status.ancestors) > 0 && status.ancestors.all(a,
        a.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration
        == metadata.generation))
      failed: >-
        has(status.ancestors) && status.ancestors.exists(a, a.conditions.exists(c, c.type ==
        'Accepted' && c.status == 'False' && c.observedGeneration == metadata.generation))
  sourceRef:
    kind: ExternalArtifact
    name: hello-route
