---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-route
  namespace: flux-system
spec:
  path: ./apps/base/demo/hello-route/app
  targetNamespace: demo
  # The route names the public Gateway and the hello Service. A cluster without the Gateway cannot
  # enable it. Its Probe is answered by the blackbox exporter.
  dependsOn:
    - name: gateway-public
    - name: hello
    - name: blackbox-exporter
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: hello-route
