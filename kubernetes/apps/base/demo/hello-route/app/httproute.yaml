---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# hello's public name: hello under the cluster's domain, on the public Gateway's https listener,
# which this namespace reaches through its k8s-gitops/gateway label.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - hello.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: hello
          port: 80
