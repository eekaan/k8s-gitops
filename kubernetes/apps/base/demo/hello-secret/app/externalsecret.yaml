---
# The path from OpenBao to an application: the value an operator writes with
# `just bao-put demo/hello greeting` becomes the key greeting of the Secret hello in demo, which
# the Deployment hello mounts as a file. The key is the one secret-rotation.yaml lists as generated:
# `just secret-rotate demo/hello greeting` replaces it with a value it makes, asks this
# ExternalSecret to refresh through its annotation force-sync, and proves that every pod of hello
# is a new one that holds the new value. One entry of spec.data with a key and a property, and no
# template, is the form the recipe takes: the Secret then holds the value as it was written.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hello
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        key: demo/hello
        property: greeting
