---
# The path from OpenBao to an application: the value an operator writes with
# `just bao-put demo/hello greeting` becomes the key greeting of the Secret hello in demo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hello
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        key: demo/hello
        property: greeting
