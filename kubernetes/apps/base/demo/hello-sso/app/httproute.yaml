---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# A second public name for the hello backend, behind the cluster's sign-in: hello-sso under the
# cluster's domain, on the public Gateway's https listener, which this namespace reaches through its
# k8s-gitops/gateway label. The SecurityPolicy of components/sso covers this route by its name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${SSO_ROUTE}
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - ${SSO_HOSTNAME}.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: hello
          port: 80
