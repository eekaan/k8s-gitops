---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
# The pod's own service account. When the pod is admitted, the operator adds its account to a
# ClusterRoleBinding that lets it read every flag set and flag source of the cluster, which is how
# the sidecar watches its flags; the namespace's default account would carry that to every pod of
# the namespace that names no account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-flags
