---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: kguardian
  annotations:
    # Removing the namespace from the tree must not delete everything in it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # kguardian's observer runs in the host's network namespace with added capabilities and reads
    # the node through host paths, which only the privileged level admits;
    # pod-security-exceptions.yaml lists that workload, and the check that reads it
    # (docs/kubernetes.md, Pod Security) requires every other pod here that the render holds to pass
    # restricted, and audit and warn at restricted at the cluster's Kubernetes minor.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
