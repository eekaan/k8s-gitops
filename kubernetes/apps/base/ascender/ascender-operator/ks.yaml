---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ascender-operator
  namespace: flux-system
spec:
  path: ./apps/base/ascender/ascender-operator/app
  targetNamespace: ascender
  # What its objects need to exist first: its CiliumNetworkPolicy is a kind Cilium's operator
  # defines; the Password generator and the ExternalSecrets of the database's Secret and of the
  # secret key's are External Secrets' kinds; and the secret key is read through the
  # ClusterSecretStore openbao, which the store's application makes.
  dependsOn:
    - name: cilium
    - name: external-secrets
    - name: openbao-store
  # Ready only once the release is installed with its pod ready, which defines the kind AWX and
  # runs the operator, and once the database's Secret and the secret key's exist: the operator
  # reads both at the start of its run for the AWX, makes a PostgreSQL of its own without the
  # first and takes or generates a secret key of its own without the second, so ascender, which
  # applies the AWX, waits for this.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: ascender-operator
