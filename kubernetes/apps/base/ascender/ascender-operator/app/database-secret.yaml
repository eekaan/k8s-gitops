---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
# The password of Ascender's database role: 32 characters of letters of both cases, digits and
# symbols, hex-encoded into 64 hexadecimal digits, so it holds no character that a connection string
# or the settings file the operator writes it into as a Python string could misread. Nothing outside
# the cluster needs it and nothing keeps it beyond the Secret below (docs/kubernetes.md, Ascender).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ascender-db-app
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
  secretKeys:
    - password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# The Secret ascender-db-app, written once, when the ExternalSecret is first synced: with
# refreshPolicy CreatedOnce the password never changes under the database. It is two things at
# once. To CloudNativePG it is the bootstrap.initdb secret of the Cluster ascender-db, a basic-auth
# Secret whose username is the database's owner, so the operator creates the role app with this
# password and makes no application Secret of its own. To Ascender's operator it is the
# postgres_configuration_secret of the AWX, of the keys its database_configuration.yml reads: host,
# port, database, username, password, sslmode and type, unmanaged, so it runs no PostgreSQL of its
# own; the dump job reads dbname beside them. It is here, in the operator's application, which
# ascender waits for, so it exists before the AWX: the operator reads it once, at the start of a
# run, and without it writes a managed configuration and starts a PostgreSQL of its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ascender-db-app
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ascender-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: app
        password: "{{ .password }}"
        dbname: app
        host: ascender-db-rw
        port: "5432"
        database: app
        # The instances serve TLS with the operator's own CA; Ascender's connections ask for it.
        sslmode: require
        type: unmanaged
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ascender-db-app
