---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# Ascender's secret key, from the secret store: the value the owner writes once into the key
# secret-key at ascender/ascender becomes the key secret_key of the Secret
# ascender-secret-key-from-store, which the AWX names in secret_key_secret. Every credential and
# encrypted setting Ascender stores is encrypted under a key derived from it, and the store comes
# back from its raft snapshot on a rebuild, before the databases, so a database restored there opens
# its credentials (docs/kubernetes.md, Ascender, for where the key lives and the order on a rebuild).
# - The name is not the operator's own ascender-secret-key: External Secrets takes over a Secret of
#   its target's name that it finds, and writes no data into one it finds when its target is
#   immutable, so under that name it would keep whatever the operator had generated there.
# - Orphan: the operator removes the owner references of the Secret it is given on every run
#   (roles/installer/tasks/cleanup.yml of its tag), and the Secret outlives the AWX, as the
#   operator's own do.
# - Immutable: once written, the key never changes under the database. A store that later holds
#   another value changes nothing in the Secret; only a Secret that is deleted is written again.
# - Refreshed every 15 minutes, by the periodic policy: each refresh reads the store, so a store
#   that no longer holds the key turns the ExternalSecret not Ready, and a deleted Secret is written
#   again from the store.
# - Here, in the application ascender waits for, so the Secret exists before the AWX is applied on a
#   cluster: the operator looks for it at the start of each run and, without it, takes or
#   generates ascender-secret-key (roles/installer/tasks/secret_key_configuration.yml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ascender-secret-key-from-store
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ascender-secret-key-from-store
    creationPolicy: Orphan
    immutable: true
  data:
    - secretKey: secret_key
      remoteRef:
        key: ascender/ascender
        property: secret-key
