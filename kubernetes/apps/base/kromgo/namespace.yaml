---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: kromgo
  annotations:
    # Removing the namespace from the tree must not delete everything in it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    # Routes of this namespace may attach to the public Gateway's https listener. kromgo has a
    # namespace of its own so that the label makes nothing else routable: the monitoring namespace,
    # which holds Prometheus, Alertmanager and Grafana, stays one no route can attach from.
    k8s-gitops/gateway: public
