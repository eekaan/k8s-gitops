---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kromgo/0.16.3/config.schema.json
# kromgo's configuration: the badges it serves, each a name and the one PromQL query it runs. A
# request names a badge, never a query, and a name not listed here gets a Not Found error before any
# query (docs/kubernetes.md, Status badges). tests/kromgo.bats holds this list to the names it pins,
# to metrics the cluster scrapes, and to queries whose result carries no label but a version: the
# JSON form of a badge returns the labels of the series it was made from, so every query below
# aggregates the others away. Prometheus's address is in the environment, not here.
#
# No graph, which would serve a range of its query, and no gallery page, which would list the
# badges: the numbers are fetched by their names.
gallery:
  enabled: false

badges:
  - id: kubernetes_version
    title: Kubernetes
    query: max by (git_version) (kubernetes_build_info{job="apiserver"})
    valueExpr: labels[?"git_version"].orValue("unknown")
    colorExpr: '"blue"'

  - id: talos_version
    title: Talos
    query: max by (version_id) (node_os_info{name="Talos"})
    valueExpr: labels[?"version_id"].orValue("unknown")
    colorExpr: '"blue"'

  - id: cluster_node_count
    title: Nodes
    query: count(kube_node_info)
    valueExpr: string(int(result))
    colorExpr: '"green"'

  - id: cluster_pod_count
    title: Pods
    query: sum(kube_pod_status_phase{phase="Running"})
    valueExpr: string(int(result))
    colorExpr: '"green"'

  # The age of the oldest node, which a replaced node does not reset until it is the oldest left.
  - id: cluster_age_days
    title: Age
    query: round((time() - min(kube_node_created)) / 86400)
    valueExpr: string(int(result)) + "d"
    colorExpr: '"green"'

  - id: cluster_cpu_usage
    title: CPU
    query: round(avg(instance:node_cpu_utilisation:rate5m) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: colorScale(result, [35.0, 75.0], ["green", "orange", "red"])

  - id: cluster_memory_usage
    title: Memory
    query: round(sum(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: colorScale(result, [35.0, 75.0], ["green", "orange", "red"])

  # The alerts that fire, but for Watchdog, which fires always to show the pipeline works, and
  # InfoInhibitor, which fires while an alert of severity info does and inhibits nothing a person
  # reads; zero when none does, where the query alone would have no value at all.
  - id: firing_alerts
    title: Alerts
    query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
    valueExpr: string(int(result))
    colorExpr: 'result == 0.0 ? "green" : "red"'
