---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
# The app-template chart from its publisher's public OCI registry, the chart the tree's namespaces
# have defaults for (components/common) and n8n runs from: kromgo is one container and its Service,
# which the chart makes and leaves the environment, the probes and the security context to values
# this tree reads in full.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: app-template
spec:
  # The tag is pinned: a new chart arrives by a change to this file, which Flux applies at once.
  interval: 12h
  # The chart's packaged layer, which helm-controller reads as it is.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    # renovate: datasource=docker depName=ghcr.io/bjw-s-labs/helm/app-template
    tag: 5.3.0
  # Go regular expressions, kept to syntax POSIX extended expressions read the same way (no \d).
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/heads/main$'
