---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# kromgo's public name: kromgo under the cluster's domain, on the public Gateway's https listener,
# which this namespace reaches through its k8s-gitops/gateway label. Only the badge paths go to it:
# kromgo's health endpoints and its other pages answer the Gateway's 404, and its metrics are on a
# port this route does not name. The Service is the chart's, named after the release.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kromgo
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - kromgo.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /badges/
      backendRefs:
        - name: kromgo
          port: 8080
