---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  # The pod's user and security context are in the values in full, not taken from the namespace's
  # app-template-defaults ConfigMap, as the render that validates the tree reads only the
  # ConfigMaps an application builds itself.
  valuesFrom:
    - kind: ConfigMap
      name: kromgo-values
  values:
    persistence:
      # The configuration, which is the list of badges kromgo serves: a directory kromgo reads at
      # start, mounted read only. kustomize writes the name of the generated ConfigMap here.
      config:
        type: configMap
        name: kromgo-config
        globalMounts:
          - path: /config
            readOnly: true
