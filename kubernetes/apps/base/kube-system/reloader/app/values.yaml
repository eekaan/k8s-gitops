---
# Values for the Reloader chart, read by the HelmRelease through a ConfigMap generated without
# substitution. Keys not set here keep the chart's defaults: one replica, watching every namespace.

reloader:
  # Only a workload annotated for it is restarted when a ConfigMap or Secret it uses changes;
  # nothing else is.
  autoReloadAll: false
  # Scraped through its pods: the chart makes the Service a ServiceMonitor would select only when
  # reloader.service is set, and one monitor is enough.
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: true
  deployment:
    # The chart's pod context already holds the non-root user and the runtime's seccomp profile; its
    # container context is empty, which leaves capabilities and privilege escalation to the image,
    # and the restricted Pod Security level requires them dropped and off.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
