---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/runtimeclass-node-v1.json
# gVisor, from the node image's siderolabs/gvisor extension, which registers the containerd runtime
# handler runsc: a pod that sets runtimeClassName: gvisor runs on gVisor's user-space kernel instead
# of the node's.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
