---
# Values for the kubelet-csr-approver chart, read by the HelmRelease through a ConfigMap generated
# without substitution. The node name pattern and the node network are cluster-config variables,
# so the HelmRelease sets them in its own values. Keys not set here keep the chart's defaults: two
# replicas with leader election, and in each request at most one DNS name, which must start with
# the requesting node's name.

# Nothing in this repository makes node names resolvable in the cluster's DNS, so the approver does
# not look them up; the name pattern and the node network bound what it approves.
bypassDnsResolution: true

# Without the approver no kubelet gets a serving certificate, so it runs at the priority Kubernetes
# gives cluster add-ons.
priorityClassName: system-cluster-critical

metrics:
  serviceMonitor:
    enabled: false
