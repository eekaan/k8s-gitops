---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
# Kubernetes creates kube-system; this sets its labels and nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations:
    # Removing the namespace from the tree must never delete it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Cilium's agents and operator, the Envoy of Cilium and Spegel use the host's network or paths,
    # or added capabilities, which only the privileged level admits; pod-security-exceptions.yaml
    # lists each workload that needs a level above restricted, and the check that reads it
    # (docs/kubernetes.md, Pod Security) requires every other pod here that the render holds to
    # pass restricted, and audit and warn at restricted at the cluster's Kubernetes minor. Talos's
    # admission configuration exempts kube-system from Pod Security admission, so these labels
    # state the levels the check holds the rendered pods to, and admission applies none of them.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
