---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpa
  namespace: flux-system
spec:
  path: ./apps/base/kube-system/vpa/app
  targetNamespace: kube-system
  # The recommender reads usage from the resource metrics API, which metrics-server serves, and the
  # chart's Helm test fails without it. Its chart makes a PodMonitor, a kind that exists once
  # prometheus-operator-crds is Ready.
  dependsOn:
    - name: metrics-server
    - name: prometheus-operator-crds
  # Ready only once the release is installed and the recommender runs, so an application that names
  # this one in dependsOn finds the VerticalPodAutoscaler definitions.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: vpa
