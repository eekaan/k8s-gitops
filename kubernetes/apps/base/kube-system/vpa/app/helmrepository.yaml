---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
# The Vertical Pod Autoscaler's project publishes a chart of its own, which says it is under
# development and not ready for production, so this is Fairwinds' chart, which follows an older
# release of the recommender. It is published to a classic Helm repository only, and no public OCI
# mirror carries it, so Flux reads the repository's index.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds
spec:
  interval: 12h
  url: https://charts.fairwinds.com/stable
