---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 30m
  chart:
    spec:
      chart: vpa
      # The version is pinned: a new chart arrives by a change to this file, which Flux applies at once.
      version: 5.2.0
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: fairwinds
  valuesFrom:
    - kind: ConfigMap
      name: vpa-values
