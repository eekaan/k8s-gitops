---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
  labels:
    # The release's install may take the 10m the root's defaults give it on a new cluster, where the
    # pods turn ready only once the approver has signed each kubelet's serving certificate; the
    # Kustomization waits for it as long, instead of failing its health check after 3m and
    # retrying every minute until the release is Ready.
    k8s-gitops/timeout: long
spec:
  path: ./apps/base/kube-system/metrics-server/app
  targetNamespace: kube-system
  # Ready only once the metrics API is served, so an application that names this one in dependsOn
  # starts when it answers.
  wait: true
  # metrics-server reads each kubelet over its serving certificate, which exists only once the
  # approver has approved the kubelet's request. Its chart makes a ServiceMonitor, a kind that
  # exists once prometheus-operator-crds is Ready.
  dependsOn:
    - name: kubelet-csr-approver
    - name: prometheus-operator-crds
  sourceRef:
    kind: ExternalArtifact
    name: metrics-server
