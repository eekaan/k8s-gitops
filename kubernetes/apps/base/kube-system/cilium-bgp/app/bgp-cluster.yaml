---
# Every worker, and no control plane, runs one BGP instance in the cluster's AS and peers with both
# edge routers in theirs, over eBGP. Talos labels its control planes
# node-role.kubernetes.io/control-plane and its workers with no role, and only the workers' ports
# may carry the service range. The edge routers sit on the node subnet, one hop from every worker,
# so the sessions keep eBGP's TTL of 1. Without localPort a worker opens its sessions and listens
# for none.
#
# A worker that carries the label node-restriction.kubernetes.io/bgp-out stops matching, and Cilium
# then shuts its sessions down with a Cease, so the edge routers withdraw its paths at once instead
# of keeping them as stale for the graceful restart time. The recipes that drain or reboot a worker
# set it first and remove it when the node is Ready. The NodeRestriction admission plugin keeps a
# kubelet from setting or removing a label under node-restriction.kubernetes.io/ on its own Node.
# The node's Cilium agent copies its Node's labels to its CiliumNode, whose labels the operator
# matches this selector against, so a node whose agent is not running does not stop matching.
# docs/infrastructure.md cites Cilium's source for each step; scripts/lib/cluster.sh names the same
# key.
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: edge
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      - key: node-restriction.kubernetes.io/bgp-out
        operator: DoesNotExist
  bgpInstances:
    - name: cluster
      localASN: ${BGP_CLUSTER_ASN}
      peers:
        - name: edge-1
          peerASN: ${BGP_EDGE_ASN}
          peerAddress: ${BGP_EDGE_ADDRESS_1}
          peerConfigRef:
            name: edge
        - name: edge-2
          peerASN: ${BGP_EDGE_ASN}
          peerAddress: ${BGP_EDGE_ADDRESS_2}
          peerConfigRef:
            name: edge
