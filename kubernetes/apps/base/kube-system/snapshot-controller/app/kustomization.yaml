---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The definitions and the controller are not here: crds.yaml and controller.yaml apply them from the
# upstream repository at the tag gitrepository.yaml pins.
resources:
  - gitrepository.yaml
  - crds.yaml
  - controller.yaml
