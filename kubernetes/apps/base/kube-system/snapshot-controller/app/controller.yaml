---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Applies the snapshot controller as upstream deploys it, from the GitRepository beside it: two
# replicas with leader election, in kube-system, which upstream's manifests name. Like the
# definitions' Kustomization, it is not a child of the root and substitutes nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter-controller
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  # The controller watches the definitions' kinds and does not become ready without them.
  dependsOn:
    - name: external-snapshotter-crds
  sourceRef:
    kind: GitRepository
    name: external-snapshotter
  path: ./deploy/kubernetes/snapshot-controller
  prune: true
  # Ready once the controller's Deployment is; the application's own wait waits for that.
  wait: true
