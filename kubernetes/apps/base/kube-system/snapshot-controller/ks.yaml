---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  path: ./apps/base/kube-system/snapshot-controller/app
  targetNamespace: kube-system
  # Ready only once both inner Kustomizations in app/ are: the definitions established and the
  # controller running, so an application that names this one in dependsOn finds both.
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: snapshot-controller
