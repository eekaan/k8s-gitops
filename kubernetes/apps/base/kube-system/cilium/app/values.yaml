---
# Values for the Cilium chart. Flux's HelmRelease reads them through a ConfigMap generated without
# substitution, and scripts/install-cilium passes this file to helm as it is, so both install the
# same thing. Keys not set here keep the chart's defaults.
#
# ServiceMonitors and Grafana dashboards are off wherever the chart has them. scripts/install-cilium
# installs from this file before Flux runs, when no monitoring resource definition exists yet, and
# the chart refuses a ServiceMonitor without its definition; dashboards wait for a Grafana. The
# agents' metrics endpoint needs no definition, so it is on here, and the cilium-monitoring
# application scrapes it once the definitions are there.

# Talos runs without kube-proxy, so Cilium serves Services itself.
kubeProxyReplacement: true
# Serving Services itself, Cilium translates a Service's address where a socket connects, in hooks
# on the node's kernel. A pod under gVisor or Kata Containers runs on a kernel of its own, so its
# sockets never pass them, and it would reach no Service, the resolver included. With this the
# agents translate at each pod's interface instead, and at the socket only for processes in the
# node's own network namespace (docs/kubernetes.md, Runtime classes).
socketLB:
  hostNamespaceOnly: true
# KubePrism serves the API server on every node at localhost:7445, so Cilium reaches it before any
# Service works and without depending on the cluster's external endpoint.
k8sServiceHost: localhost
k8sServicePort: 7445

# The cloud's ports accept only a node's own address, so pod traffic between nodes is encapsulated.
routingMode: tunnel
tunnelProtocol: vxlan

# Each node's pod range comes from its Node object, which Talos's cluster network settings fill.
ipam:
  mode: kubernetes

# Talos mounts the cgroup v2 hierarchy at /sys/fs/cgroup itself; Cilium uses that mount.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# The capability sets Talos's documentation gives for Cilium. They leave out SYS_MODULE, as Talos
# does not let workloads load kernel modules.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# A changed configuration takes effect only when the pods restart, so the chart rolls them.
rollOutCiliumPods: true
prometheus:
  # The agents serve their metrics, the BGP sessions' among them, on port 9962 of the node they run
  # on, as they run on the host's network.
  enabled: true
  serviceMonitor:
    enabled: false
dashboards:
  enabled: false
envoy:
  prometheus:
    serviceMonitor:
      enabled: false

operator:
  # Two replicas, on different nodes, so losing a node does not stop the operator.
  replicas: 2
  rollOutPods: true
  prometheus:
    serviceMonitor:
      enabled: false
  dashboards:
    enabled: false

hubble:
  # Relay gathers the flows of every node in one place; the UI waits until something exposes it.
  relay:
    enabled: true
    prometheus:
      serviceMonitor:
        enabled: false
  ui:
    enabled: false
  metrics:
    serviceMonitor:
      enabled: false
    dashboards:
      enabled: false

# Every agent encrypts with WireGuard: it makes its own key pair, publishes the public key on its
# node's CiliumNode and keeps a WireGuard device, cilium_wg0, with a peer for every other node, and
# in tunnel mode every packet the overlay carries between two nodes passes through that device,
# encrypted, to UDP 51871, which the nodes' firewall admits from the nodes alone. The type is named,
# as the chart's default is ipsec. Node-to-node encryption, which would also take traffic from and
# to the nodes' own addresses, stays off: it is beta at this version, the control planes opt out of
# it, and it would route a pod's connection to a node through the tunnel, so that it reaches the
# node from the pod's address instead of its node's, on which the node firewall's sources rest
# (docs/cluster.md, Sources). docs/kubernetes.md, Encryption between nodes, says what is encrypted.
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false

# Services of type LoadBalancer take their addresses from the pool of the cilium-bgp application,
# and the workers advertise them over BGP to the edge routers, which that application configures
# (ADR 0013). Layer 2 announcements stay off.
enableLBIPAM: true
bgpControlPlane:
  enabled: true
  # The agent reports each peer's session in the status of the node's CiliumBGPNodeConfig, which
  # scripts/lib/cluster.sh reads to wait until a worker's sessions are established again.
  statusReport:
    enabled: true
l2announcements:
  enabled: false

# Policy enforcement stays in the chart's default mode: a pod is open in a direction until a policy
# that selects it for it asks for the default deny, and then only what the policies allow passes.
# The agents evaluate every policy and report what it would drop, and drop nothing a policy denies
# at layers 3 and 4, which is all audit mode covers (no layer-7 rule), until the policies have been
# watched; taking this line out makes them enforce (docs/kubernetes.md, Service addresses).
policyAuditMode: true

# Off until something uses them: Gateway API also needs its CRDs, and a cluster mesh needs a second
# cluster.
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
clustermesh:
  useAPIServer: false
