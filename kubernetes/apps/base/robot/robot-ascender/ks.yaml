---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: robot-ascender
  namespace: flux-system
spec:
  path: ./apps/base/robot/robot-ascender/app
  targetNamespace: robot
  # Its CiliumNetworkPolicy is a kind Cilium's operator defines; its ConfigMap is the suite robot's
  # CronJob mounts, and the suite opens Ascender's sign-in page. Naming robot and ascender is what
  # makes a cluster that selects this piece without either refused.
  dependsOn:
    - name: cilium
    - name: robot
    - name: ascender
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: robot-ascender
