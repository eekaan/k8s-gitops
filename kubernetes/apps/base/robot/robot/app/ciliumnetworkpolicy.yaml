---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What Robot Framework's runner lets through, on top of the namespace's default deny: nothing in, as
# it listens on nothing, and out the cluster's resolver and hello's pods; robot-runner-ascender adds
# Ascender's web pods where a cluster runs Ascender. Its Chromium opens whatever page a suite names
# and runs unsandboxed: once the cluster enforces the policies, this egress, not the suites, keeps it
# to the tree's targets. While it audits them, a flow they would drop is reported and passes
# (docs/kubernetes.md, Service addresses and Robot Framework).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: robot-runner
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: robot
      app.kubernetes.io/component: runner
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # The cluster's resolver, for the names of the targets' Services.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # hello, ROBOT_TARGET_HELLO in ks.yaml: the pods the Service hello in demo selects, on the
    # container port its port 80 targets, 8080. A Service's address is translated to a pod's before
    # policy applies, so the rule names the pods; hello admits the runner by a rule beside it.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": demo
            app.kubernetes.io/name: hello
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# What the report server lets through: the kubelet's readiness probe on its port, and nothing out, as
# it serves the claim and calls nothing. No pod reaches it: the runner writes the claim and does not
# connect to the server, and just robot reaches it through a port forward, which the container
# runtime connects inside the pod on its loopback, where no policy applies (docs/kubernetes.md,
# Robot Framework).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: robot-reports
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: robot
      app.kubernetes.io/component: reports
  # The namespace's default deny alone denies; this policy only allows.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The kubelet's readiness probe, which arrives from the node the pod runs on: host is every
    # process in that node's network namespace, the pods of the host's network among them, so they
    # reach the reports as well.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
