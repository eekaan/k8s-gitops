---
# The Secret the restic movers read: the application's repository, its password, and the S3 key and
# region it is reached with. The key volsync in the secret store holds the master password and the
# cluster's S3 key, the same for every application. The repository's password is derived from the
# master here, as the SHA-256 digest of the master, a slash and the application's name, so the
# master never reaches the application's namespace and one application's Secret opens no other
# application's repository (ADR 0015). The Secret holds only what the template renders. The
# repository is the application's own path in the VolSync bucket, as restic keeps one repository per
# volume; its bucket, endpoint and region come from cluster-config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ${APP}-volsync
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${BACKUP_BUCKET_PREFIX}-volsync/${APP}
        RESTIC_PASSWORD: '{{ printf "%s/%s" .RESTIC_MASTER_PASSWORD "${APP}" | sha256sum }}'
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        AWS_DEFAULT_REGION: ${S3_REGION}
  dataFrom:
    - extract:
        key: volsync
