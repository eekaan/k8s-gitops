---
# The Secret the restic movers read: the repository and its password, and the S3 key it is reached
# with. The password and the key are the properties of the key volsync in the secret store, the same
# for every application; the repository is the application's own path in the VolSync bucket, from
# cluster-config, as restic keeps one repository per volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ${APP}-volsync
    template:
      data:
        RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${BACKUP_BUCKET_PREFIX}-volsync/${APP}
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync
