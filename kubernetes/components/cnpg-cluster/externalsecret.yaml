---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# The Secret the ObjectStore's credentials name: the cluster's S3 key, the one the volume backups
# use, read from the secret store's key volsync with only its two key fields, so the restic master
# password never reaches this namespace; the region, which cluster-config holds; and the customer
# key of SSE-C, from the key postgres-backups, which just bao-seed-postgres writes once for every
# database of the cluster. The S3 key reaches every bucket of the project, the postgres bucket among
# them (docs/infrastructure.md), so no further step seeds it: just bao-seed-volsync has written it
# already. The label has the instances re-read the Secret when it changes, as a replaced S3 key does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER_NAME}-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ${CNPG_CLUSTER_NAME}-backup
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
        REGION: ${S3_REGION}
        SSE_C_KEY: "{{ .sseCustomerKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: volsync
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: volsync
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: sseCustomerKey
      remoteRef:
        key: postgres-backups
        property: SSE_C_KEY
---
# The same S3 key for the dump job, read from the same store key volsync: only its two properties,
# so neither the restic master password nor the customer key above reaches the job. Only the dump
# job's upload container takes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER_NAME}-dump-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ${CNPG_CLUSTER_NAME}-dump-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: volsync
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: volsync
        property: AWS_SECRET_ACCESS_KEY
