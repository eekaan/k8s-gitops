---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/externalsecret-external-secrets-v1.json
# The cluster's S3 key, the one the volume backups and the etcd snapshots use, read from the secret
# store's key volsync: only its two properties, so the restic master password never reaches this
# namespace. The key reaches every bucket of the project, the postgres bucket among them
# (docs/infrastructure.md), so no further step seeds it: just bao-seed-volsync has written it
# already. Only the dump job's upload container takes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_CLUSTER_NAME}-dump-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ${CNPG_CLUSTER_NAME}-dump-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: volsync
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: volsync
        property: AWS_SECRET_ACCESS_KEY
