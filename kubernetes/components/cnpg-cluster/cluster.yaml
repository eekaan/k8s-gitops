---
# One application's PostgreSQL cluster: a primary and two streaming replicas, each on a worker of its
# own with a volume of its own. CNPG_CLUSTER_NAME names it, and CNPG_STORAGE_SIZE sizes each
# instance's volume. The operator creates the database app, owned by the user app, with that user's
# credentials and connection URI in the Secret <name>-app, and the Services <name>-rw for the
# primary, <name>-ro for the replicas and <name>-r for any instance.
#
# Its WAL is archived continuously, and base backups are taken daily, to the object storage through
# the Barman Cloud plugin, encrypted at the provider with a customer key: spec.plugins below, the
# ObjectStore and the ScheduledBackup beside this file, from which the cluster can be restored to a
# point in time. Once a day the dump job in cronjob.yaml also copies the application database out as
# a logical dump, encrypted before it leaves the cluster (docs/kubernetes.md, PostgreSQL).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${CNPG_CLUSTER_NAME}
spec:
  instances: 3

  # PostgreSQL 18 from the operator's community images, in the standard variant, which with the
  # Barman Cloud plugin replaces the deprecated system images. Without an image here the operator
  # writes its own default into the Cluster once, when the Cluster is created, and never moves it.
  # The tag names the minor version; the publisher rebuilds the image under it, and a node keeps the
  # build it pulled first, so instances can run different builds of one minor version. A new minor
  # is a rolling update: the replicas one at a time, then the primary, restarted. A new major comes
  # from Renovate in a pull request of its own, labelled postgresql-major, that never merges itself:
  # the operator upgrades every database of the component in place, and the server name below moves
  # with it in that pull request.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  storage:
    # One copy per instance, on its own node, without DRBD. The three instances already are three
    # copies on three workers, kept in step by PostgreSQL's replication, and the operator's
    # documentation advises a single replica at the storage level for that reason: on the replicated
    # default class every write would be kept six times. The cost is that an instance cannot move: it
    # is missing while its node is down, and when its node's data volume is lost its claim and pod are
    # deleted and the operator clones it anew from the primary (docs/kubernetes.md, PostgreSQL).
    storageClass: linstor-node-local
    size: ${CNPG_STORAGE_SIZE:=5Gi}

  affinity:
    # Never two instances on one node, which would put two of the three copies on one data volume.
    # With three workers, an instance made while a worker is gone waits until it is back or replaced.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  # Every WAL segment goes to the object storage as the plugin's sidecar in each instance's pod
  # archives it, to the directory serverName names under the destination the ObjectStore gives. The
  # plugin, not the in-tree barmanObjectStore the operator deprecates.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${CNPG_CLUSTER_NAME}
        # The archive's directory: the cluster's name while the image is PostgreSQL 18, and
        # ${CNPG_CLUSTER_NAME}-pg<major> after a move to a later major, changed in the pull request
        # that moves imageName, which tests/postgresql.bats holds (docs/runbooks/postgres-restore.md,
        # Moving to a new PostgreSQL major).
        serverName: ${CNPG_CLUSTER_NAME}

  # The operator's two disruption budgets: a drain of the primary's node waits for a switchover to a
  # replica, and drains take one replica at a time.
  enablePDB: true

  # Guaranteed quality of service, requests equal to limits, as the operator's documentation
  # recommends for PostgreSQL; PostgreSQL's default shared_buffers, 128MB, is the quarter of the
  # memory it suggests to start from.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
