---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# A PostgreSQL cluster for one application, run by the CloudNativePG operator, the PodMonitor that
# scrapes it, and its two backups to the object storage, each with the ExternalSecret that gives it
# the S3 key: the WAL archive and the daily base backup through the Barman Cloud plugin, encrypted at
# the provider with a customer key, and a CronJob that dumps its database once a day, encrypted
# before it leaves. An application takes it by naming this component in its ks.yaml's
# spec.components, the cluster and its namespace in its postBuild.substitute, and the operator's and
# the plugin's applications in its dependsOn, with external-secrets and openbao-store for the
# credentials (docs/kubernetes.md, PostgreSQL):
#
#   components:
#     - ../../../../../components/cnpg-cluster
#   postBuild:
#     substitute:
#       CNPG_CLUSTER_NAME: <app>-db
#       CNPG_NAMESPACE: <the Kustomization's targetNamespace>
#
#   CNPG_CLUSTER_NAME  the Cluster's name, and the name of its ObjectStore, its ScheduledBackup, the
#                      Secret of its backup credentials and the directory of its dumps and, while it
#                      runs PostgreSQL 18, of its archive
#   CNPG_NAMESPACE     the namespace the application is applied to, which a component cannot read
#                      from targetNamespace; it is a level of the archive's path, so that two
#                      databases of one name in two namespaces archive to two places
#   CNPG_BACKUPS_SUSPENDED
#                      "true" holds the dump CronJob and the ScheduledBackup, which make no dump and
#                      no base backup while it is set, and changes nothing else: a database being
#                      restored onto a rebuilt cluster, whose Cluster comes back empty under the old
#                      name, so that its dumps and base backups do not go to the old path; false
#                      when unset (docs/kubernetes.md, PostgreSQL; docs/runbooks/rebuild.md)
#
# The archive is s3://<BACKUP_BUCKET_PREFIX>-postgres/<CLUSTER_NAME>/<CNPG_NAMESPACE>/<server name>,
# from cluster-config, the two values above and the server name of the Cluster's plugin entry
# (cluster.yaml): its base backups in base/ and its WAL in wals/ there. The dumps are files of their
# own names in <name>, beside them while the server name is the cluster's name.
resources:
  - cluster.yaml
  - podmonitor.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  - externalsecret.yaml
  - cronjob.yaml

# The dump job's steps' scripts, which tests/postgres-dumps.bats runs as the containers run them. The
# component carries its own copies of the etcd snapshot job's generic ones, as a component cannot
# read a file outside its directory. The job reads the ConfigMap afresh at every run, so it needs no
# hash in its name. The scripts hold shell variables, so Flux leaves them alone: none holds a
# `${...}`.
configMapGenerator:
  - name: ${CNPG_CLUSTER_NAME}-dump-scripts
    files:
      - scripts/fetch-age.sh
      - scripts/dump.sh
      - scripts/encrypt.sh
      - scripts/upload.sh
generatorOptions:
  disableNameSuffixHash: true
