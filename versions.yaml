---
# The Talos and Kubernetes versions of the cluster, set only here. Renovate updates each through
# the comment line above it, as the same package as the talosctl and kubectl pins in mise.toml, so
# one pull request moves a version and its CLI together.
# renovate: datasource=github-tags depName=siderolabs/talos
talos: v1.14.6
# renovate: datasource=github-tags depName=kubernetes/kubernetes
kubernetes: v1.37.1

# What just ci-host-setup installs on the CI host (docs/runbooks/ci-host.md). The runner's release,
# and the SHA-256 of its linux-x64 package as the release's notes give it, which setup verifies
# before it installs anything. Renovate updates the version only: the checksum changes with it by
# hand, or setup refuses the package.
# renovate: datasource=github-releases depName=actions/runner
actions_runner: 2.338.2
actions_runner_sha256: baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40
# The Dagger engine the CI host runs, by digest: the version of the dagger CLI pinned in
# mise.toml, which the jobs connect to it with. It moves with that pin, by hand.
dagger_engine: registry.dagger.io/engine:v1.0.0-beta.27@sha256:ad121f720ed9bfb8e740f99dd783fa8472965a5e262fc64ff3ef2634cea1e6dd
