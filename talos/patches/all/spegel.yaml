# containerd keeps the image layers it has unpacked, which Spegel serves to the other nodes. Talos
# has containerd discard them from its content store once they are unpacked, to save disk space;
# kept, the node holds every image's layers twice, as pulled in the content store and unpacked in
# the snapshotter. This is the CRICustomizationConfig Talos' guide to Spegel gives for Talos 1.14
# and later; applying it restarts containerd's CRI instance, without a reboot.
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
