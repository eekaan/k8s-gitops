# Metrics of the control plane components for Prometheus, which scrapes them from inside the
# cluster. Talos binds the controller manager and the scheduler to 127.0.0.1, and etcd serves its
# metrics only on its client port, which takes client certificates. A node's own address on the
# node network differs from node to node and talman.yaml gives no node its own, so each listens on
# all of the node's addresses, its floating address included. The node's firewall admits these
# ports from the nodes' own addresses, from which Prometheus arrives when its pod runs on another
# node, and from the pod range, when it runs on this one (talos/firewall.yaml).
---
# The controller manager's secure port, 10257: HTTPS, with every request but its health checks
# authorized by the API server.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# The scheduler's secure port, 10259, likewise.
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# etcd's metrics and health, and nothing else, on 2381: plain HTTP, without authentication.
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
