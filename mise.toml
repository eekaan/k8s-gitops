# Exact versions only: scripts/tools-check compares these with what each binary reports.
[tools]
just = "1.59.0"
opentofu = "1.13.9"
talosctl = "1.14.6"
# talman is not in mise's registry; its GitHub releases carry prebuilt archives.
"github:ludwighansson/talman" = "1.0.0-beta.10"
kubectl = "1.37.1"
# The registry names the flux CLI after its repository.
flux2 = "2.10.0"
helm = "4.3.1"
kustomize = "5.8.3"
sops = "3.13.3"
age = "1.3.2"
yq = "4.54.3"
jq = "1.8.2"
cosign = "3.1.4"
shellcheck = "0.11.0"
yamllint = "1.38.0"
gitleaks = "8.30.1"
bats = "1.14.0"
rclone = "1.76.0"
# Dagger 1.0 betas are published on dl.dagger.io, not as GitHub releases, so the registry entry cannot install them.
# The checksums are those of the release's checksums.txt; mise verifies only a pinned checksum at install.
"http:dagger" = { version = "1.0.0-beta.27", url = 'https://dl.dagger.io/dagger/releases/{{ version }}/dagger_v{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.tar.gz', platforms = { linux-x64 = { checksum = "sha256:de2a3ca569c3a955d5ce98d2c4879b67a4459c394a7e1684261ba7152bdb6865" }, linux-arm64 = { checksum = "sha256:1ef003a4522d4f39c862d6dd360bc2916a605f87aad3dce4988c01f4bcd73358" }, macos-x64 = { checksum = "sha256:14b63d665c0bd71a2882b7e90e40dcf96aca27ebee6964d30c8802cf509bc29d" }, macos-arm64 = { checksum = "sha256:5efd7f5cec39093dd10d4035aae8ee87f82403606c0a6d958d74a0edee04171a" } } }
