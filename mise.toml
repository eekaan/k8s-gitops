# Exact versions only: scripts/tools-check compares these with what each binary reports.
[tools]
just = "1.59.0"
opentofu = "1.13.9"
talosctl = "1.14.6"
# talman is not in mise's registry; its GitHub releases carry prebuilt archives.
"github:ludwighansson/talman" = "1.0.0-beta.10"
kubectl = "1.37.1"
# The registry names the flux CLI after its repository.
flux2 = "2.10.0"
helm = "4.3.1"
kustomize = "5.8.3"
kubeconform = "0.8.0"
sops = "3.13.3"
age = "1.3.2"
yq = "4.54.3"
jq = "1.8.2"
cosign = "3.1.4"
shellcheck = "0.11.0"
yamllint = "1.38.0"
gitleaks = "8.30.1"
bats = "1.14.0"
rclone = "1.76.0"
# scripts/pod-security-check evaluates the rendered pod templates against the Pod Security Standards
# with Kyverno's podSecurity rule, which runs Kyverno's fork of the Pod Security admission policy
# library at the 1.36 check set. The rule is of Kyverno's legacy policy type, whose execution the
# 1.20 release removes from Kyverno's controllers (its release notes), so the pin stays on the 1.19
# line. The fork's checks match those of upstream's v0.37 library except the 1.37 relaxation of the
# sysctl check, so the evaluator is no more permissive than a 1.37 cluster: the line below records
# that minor, and the check fails when versions.yaml names a newer one. A newer minor's checks are
# compared with the fork's by hand, and the record and the pin move with them by hand too: the http
# backend is not one Renovate moves (.renovate/by-hand.tsv). The checksums are those of the release's
# checksums.txt.
# pod-security-evaluator-covers: v1.37
"http:kyverno" = { version = "1.19.2", url = 'https://github.com/kyverno/kyverno/releases/download/v{{ version }}/kyverno-cli_v{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="x86_64") }}.tar.gz', platforms = { linux-x64 = { checksum = "sha256:357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a" }, linux-arm64 = { checksum = "sha256:250f2a02f143d5c6425e686b13c130d3a3ba7372dba6a7210d599d1b0dd12e92" }, macos-x64 = { checksum = "sha256:b645654ab8e65bd4aa64de9228e274b388bab19b3404a4e9af70174b3d5ad230" }, macos-arm64 = { checksum = "sha256:7915c03c613c22363a100adb3da8d06f2e2626d9d21a98b97f921795ffdc536f" } } }
# ci-host-setup and ci-host-remove get the runner's registration and remove tokens with it.
gh = "2.103.3"
# Dagger 1.0 betas are published on dl.dagger.io, not as GitHub releases, so the registry entry cannot install them.
# The checksums are those of the release's checksums.txt; mise verifies only a pinned checksum at install.
"http:dagger" = { version = "1.0.0-beta.27", url = 'https://dl.dagger.io/dagger/releases/{{ version }}/dagger_v{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.tar.gz', platforms = { linux-x64 = { checksum = "sha256:de2a3ca569c3a955d5ce98d2c4879b67a4459c394a7e1684261ba7152bdb6865" }, linux-arm64 = { checksum = "sha256:1ef003a4522d4f39c862d6dd360bc2916a605f87aad3dce4988c01f4bcd73358" }, macos-x64 = { checksum = "sha256:14b63d665c0bd71a2882b7e90e40dcf96aca27ebee6964d30c8802cf509bc29d" }, macos-arm64 = { checksum = "sha256:5efd7f5cec39093dd10d4035aae8ee87f82403606c0a6d958d74a0edee04171a" } } }
